<!DOCTYPE html>
<html lang="en">
<head>
<style>html{font-size:18px}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Energy | System Administration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#10243a;--blue:#1769aa;--light:#eef2f7;--border:#d8e0e8;--muted:#667085;--green:#16803c;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--light);font-family:Arial,sans-serif;color:#172b42}
header{background:var(--navy);color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header h1{font-size:22px;margin:0}header p{margin:5px 0 0;color:#cbd5e1;font-size:15px}
.header-actions,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}button.secondary{background:#e7edf4;color:#18334f}button.danger{background:#b42318}button:disabled{opacity:.5;cursor:not-allowed}
.container{max-width:1400px;margin:22px auto;padding:0 18px}.notice{padding:12px 15px;background:#eef6ff;border:1px solid #b7d7f5;border-radius:8px;color:#17436b;font-size:15px;line-height:1.5;margin-bottom:16px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.panel{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 7px #10243a0a}.panel h2{font-size:18px;margin:0;padding:17px 18px;border-bottom:1px solid var(--border)}
.user-list{padding:8px;max-height:72vh;overflow:auto}.user-item{width:100%;text-align:left;background:#fff;color:#172b42;border:1px solid transparent;padding:12px;border-radius:7px;margin:2px 0}.user-item:hover{background:#f4f7fb}.user-item.selected{background:#eaf3fc;border-color:#9bc5eb}.user-item strong{display:block;font-size:16px}.user-item small{display:block;color:var(--muted);margin-top:5px;font-size:14px}.badge{display:inline-block;border-radius:20px;padding:3px 8px;font-size:12px;font-weight:bold;background:#edf1f5;color:#475467;margin-top:7px}.badge.active{background:#e7f6ec;color:#137333}.badge.inactive{background:#fff0ed;color:#b42318}
.content{padding:18px}.section{border:1px solid var(--border);border-radius:8px;margin-bottom:15px}.section-title{font-weight:700;padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:16px}.section-body{padding:14px}.field-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:bold;color:var(--muted);margin-bottom:6px;text-transform:uppercase}.field input{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#344054}.field input[readonly]{background:#f8fafc}
.check-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.check-card{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:7px;padding:11px;font-size:15px}.check-card input{width:17px;height:17px;accent-color:var(--blue)}
.access-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.access-toolbar label{font-size:15px;font-weight:bold}.access-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:230px;overflow:auto;border:1px solid var(--border);padding:9px;border-radius:7px}.access-item{display:flex;align-items:flex-start;gap:8px;font-size:14px;padding:7px;border-radius:5px}.access-item:hover{background:#f5f8fb}.access-item input{margin:1px 0 0;accent-color:var(--blue)}.access-item span{line-height:1.35}.muted{font-size:14px;color:var(--muted);line-height:1.5}.status{font-size:15px;min-height:18px}.status.error{color:var(--red)}.status.success{color:var(--green)}.empty{padding:28px;color:var(--muted);text-align:center;font-size:15px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px}.toolbar h2{border:0;padding:0}.search{width:min(100%,360px);padding:10px;border:1px solid var(--border);border-radius:6px}.hidden{display:none!important}.password-note{font-size:14px;color:var(--muted);margin-top:5px}.inline-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.user-list{max-height:260px}.field-grid{grid-template-columns:1fr 1fr}.check-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.field-grid,.check-grid,.access-list{grid-template-columns:1fr}header{padding:15px}.content{padding:12px}}
</style>
<style id="display-sizing">
@media screen{
.container{width:100%;max-width:none;box-sizing:border-box}
:where(button,input,select,textarea){font-size:15px}
}
</style>
<script src="searchable-selects.js?v=20261118a" defer></script>
<link rel="stylesheet" href="unified-ui.css?v=20261123a">
<script src="access-control.js?v=20261123c"></script>
<script src="unified-ui.js?v=20261123a" defer></script>
<link rel="stylesheet" href="system-admin.css?v=20261123b"><script src="system-admin.js?v=20261123b"></script>
</head>
<body>
<header>
  <div><h1>System Administration</h1><p>Finance Manager · System Administrator</p></div>
  <div class="header-actions"><button class="secondary" id="backButton">Back to Dashboard</button><button class="secondary" id="logoutButton">Sign Out</button></div>
</header>
<main class="container">
  <div class="notice"><strong>Security:</strong> New accounts are created without invitation or password-setting emails. Users must change the initial password when they first sign in. Only the Finance Manager can manage users and access.</div>

  <section id="listView" class="panel">
    <div class="toolbar"><h2>Users</h2><button id="addUserButton">Add User</button></div>
    <div id="userList" class="user-list"><div class="empty">Loading users...</div></div>
  </section>

  <section id="editorView" class="panel hidden">
    <div class="toolbar"><h2 id="editorTitle">Add User</h2><button class="secondary" id="returnToListButton">Back to Users</button></div>
    <div id="editor" class="content"></div>
  </section>
</main>
<script>
const SUPABASE_URL = "https://hxhfjmtjibwkkbpakopt.supabase.co";
const SUPABASE_KEY = "sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const validPassword = value => value.length >= 6 && /[A-Za-z]/.test(value) && /[0-9]/.test(value);
let adminCatalog={customers:[],departments:[],projects:[],orders:[],links:[]},accessEditorContext=null;
let customers=[],selectedCustomerIds=new Set();
const accessModules=[['customers','Customers'],['departments','Departments'],['projects','Projects'],['orders','Purchase Orders'],['invoices','Invoices'],['collections','Collections']];
let managerProfile=null, users=[], projects=[], departments=[], projectDepartments=new Map(), selectedProjectIds=new Set(), selectedDepartmentNames=new Set(), manuallySelectedProjectIds=new Set(), excludedAutoProjectIds=new Set(), currentUser=null, currentMode='list';

function showStatus(message,type=''){const el=$('formStatus');if(el){el.textContent=message;el.className='status '+type;}}
function fail(message){$('listView').classList.add('hidden');$('editorView').classList.remove('hidden');$('editorTitle').textContent='Access Error';$('editor').innerHTML='<div class="empty" style="color:#b42318">'+escapeHtml(message)+'</div>';}
function showView(view){$('listView').classList.toggle('hidden',view!=='list');$('editorView').classList.toggle('hidden',view==='list');currentMode=view;}

async function initializePage(){
  try{
    if(sessionStorage.getItem('pe_login_verified')!=='true')throw new Error('Please sign in through the Login page first.');
    const {data:{session},error:sessionError}=await client.auth.getSession();
    if(sessionError||!session)throw new Error('Your session has expired. Sign in again.');
    const {data:profile,error}=await client.from('users_profile').select('id,username,full_name,role,active,auth_user_id').eq('auth_user_id',session.user.id).maybeSingle();
    if(error)throw error;
    if(!profile||profile.active!==true||profile.role!=='finance_manager')throw new Error('Access denied. Finance Manager permission is required.');
    await PEAccess.load(client);managerProfile=profile;PEAdminData.enable();
    await loadManagementData();
  }catch(error){fail(error.message||'Unable to initialize User Management.');}
}

async function loadManagementData(){
 const results=await Promise.all([
 client.from('users_profile').select('id,username,full_name,role,active,auth_user_id').order('id'),
 client.from('projects').select('id,project_name,company,department').order('project_name'),
 client.from('pos').select('id,po_no,project_id,project_name,company,department').order('id'),
 client.from('departments').select('id,name').order('name'),
 client.from('customer_companies').select('id,name').order('name'),
 client.from('department_customer_companies').select('department_id,customer_company_id'),
 client.from('user_permissions').select('user_id,access_profile,module_permissions')
 ]);
 for(const r of results)if(r.error)throw r.error;
 const [u,pr,po,ds,cs,links,perms]=results;
 users=(u.data||[]).map(user=>{const permission=(perms.data||[]).find(p=>Number(p.user_id)===Number(user.id)),writable=Object.values(permission?.module_permissions||{}).some(m=>m.add||m.edit||m.delete);return {...user,access_mode:user.role==='finance_manager'?'Finance Manager / System Administrator':permission?.access_profile?.mode||(writable?'editor':'viewer')};});
 projects=pr.data||[];customers=cs.data||[];departments=(ds.data||[]).map(d=>d.name);
 adminCatalog={customers,projects,departments:ds.data||[],orders:po.data||[],links:links.data||[]};
 PEAdminAccess.setCatalog(adminCatalog);PEAdminData.setCatalog(adminCatalog);
 renderUserList();showView('list');
}

function renderUserList(){
  $('userList').innerHTML=users.map(u=>`<button type="button" class="user-item" data-user-id="${Number(u.id)}"><strong>${escapeHtml(u.full_name||u.username||('User '+u.id))}</strong><small>${escapeHtml(u.username)} · ${escapeHtml(u.access_mode||u.role)}</small><span class="badge ${u.active?'active':'inactive'}">${u.active?'Active':'Inactive'}</span></button>`).join('')||'<div class="empty">No users have been created yet.</div>';
  $('userList').querySelectorAll('[data-user-id]').forEach(btn=>btn.addEventListener('click',()=>openExistingUser(Number(btn.dataset.userId))));
}

function renderAccessSections(){return PEAdminAccess.markup(accessEditorContext);}
function attachAccessHandlers(){PEAdminAccess.mount();}
function getPermissionPayload(){return PEAdminAccess.payload();}

function openAddUser(){
  currentUser=null;accessEditorContext=null;$('editorTitle').textContent='Add User';
  $('editor').innerHTML=`
    <form id="userForm" autocomplete="off">
      <div class="section"><div class="section-title">User Details</div><div class="section-body"><div class="field-grid">
        <div class="field"><label for="fullName">Full Name</label><input id="fullName" maxlength="150" required placeholder="Enter full name"></div>
        <div class="field"><label for="username">Username</label><input id="username" maxlength="80" required placeholder="Enter username"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" maxlength="254" required placeholder="Enter email address"></div>
        <div class="field"><label for="initialPassword">Initial Password</label><input id="initialPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters"></div>
        <div class="field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="Confirm initial password"></div>
      </div><p class="password-note">Minimum 6 characters, including at least one letter and one number. The user must change this password at first sign-in.</p></div></div>
      ${renderAccessSections()}
      <div class="actions"><button id="saveUserButton" type="submit">Save User</button><button class="secondary" type="button" id="cancelUserButton">Cancel</button><span id="formStatus" class="status" aria-live="polite"></span></div>
    </form>`;
  attachAccessHandlers();$('userForm').addEventListener('submit',createUser);$('cancelUserButton').addEventListener('click',()=>showView('list'));showView('editor');
}

async function openExistingUser(id){
 const user=users.find(x=>Number(x.id)===id);if(!user)return;currentUser=user;
 $('editorTitle').textContent='Manage User: '+(user.full_name||user.username);
 const results=await Promise.all([
 client.from('user_permissions').select('*').eq('user_id',id).maybeSingle(),
 client.from('user_project_access').select('project_id').eq('user_id',id),
 client.from('user_department_access').select('department').eq('user_id',id),
 client.from('user_customer_access').select('customer_company_id').eq('user_id',id),
 client.from('user_department_permissions').select('*').eq('user_id',id),
 client.from('user_customer_department_access').select('*').eq('user_id',id),
 client.from('user_order_access').select('order_id').eq('user_id',id)
 ]);
 for(const r of results)if(r.error){alert('Unable to load access: '+r.error.message);return;}
 const [perm,pa,da,ca,dr,pairs,oa]=results;
 accessEditorContext={permissions:perm.data||{},departmentNames:(da.data||[]).map(x=>x.department),projectIds:(pa.data||[]).map(x=>Number(x.project_id)),customerIds:(ca.data||[]).map(x=>Number(x.customer_company_id)),departmentRules:dr.data||[],pairs:pairs.data||[],orderIds:(oa.data||[]).map(x=>Number(x.order_id))};
 const canManage=user.role==='user',isManager=user.role==='finance_manager';
 $('editor').innerHTML='<div class="section"><div class="section-title">User Details</div><div class="section-body"><div class="field-grid"><div class="field"><label>Full Name</label><input readonly value="'+escapeHtml(user.full_name)+'"></div><div class="field"><label>Username</label><input readonly value="'+escapeHtml(user.username)+'"></div><div class="field"><label>Account Type</label><input readonly value="'+escapeHtml(isManager?'Finance Manager / System Administrator':user.role)+'"></div></div>'+
 (canManage?'<div class="inline-actions"><label class="check-card"><input id="accountActive" type="checkbox" '+(user.active?'checked':'')+'><span>Account Active</span></label><button type="button" class="secondary" id="resetPasswordButton">Reset Password</button><button type="button" class="danger" id="deleteUserButton">Delete User</button></div>':isManager?'<p class="sa-hint">The Finance Manager is the System Administrator with full system access. This account is protected.</p>':'<p class="sa-hint">This legacy account must have a linked regular user profile before its access can be configured.</p>')+'</div></div>'+
 (canManage?renderAccessSections()+'<div class="actions"><button id="saveChangesButton" type="button">Save Changes</button><button class="secondary" id="cancelEditButton" type="button">Back to Users</button><span id="formStatus" class="status" aria-live="polite"></span></div>':'');
 if(canManage){attachAccessHandlers();$('saveChangesButton').onclick=saveExistingUser;$('cancelEditButton').onclick=()=>showView('list');$('resetPasswordButton').onclick=resetUserPassword;$('deleteUserButton').onclick=deleteUser;}
 showView('editor');
}

async function createUser(event){
  event.preventDefault();const button=$('saveUserButton');button.disabled=true;showStatus('Creating user and saving access...');
  const full_name=$('fullName').value.trim(),username=$('username').value.trim(),email=$('email').value.trim().toLowerCase(),initial_password=$('initialPassword').value,confirm_password=$('confirmPassword').value;
  try{
    if(!full_name||!username||!email)throw new Error('Complete all user details.');
    if(!validPassword(initial_password))throw new Error('Password must contain at least 6 characters, including letters and numbers.');
    if(initial_password!==confirm_password)throw new Error('Password and confirmation do not match.');
    const payload={full_name,username,email,initial_password,permissions:getPermissionPayload(),department_access:[],project_access:[]};
    const {data,error}=await client.functions.invoke('create-user',{body:payload});
    if(error)throw await edgeFunctionError(error);
    if(!data?.success||!data?.user_id)throw new Error(data?.error||'The server did not confirm user creation.');
    $('userForm').reset();showStatus('User created successfully. Provide the initial password to the user securely.','success');
    await loadManagementData();
  }catch(error){showStatus(error.message||'Unable to create user.','error');}
  finally{if($('saveUserButton'))$('saveUserButton').disabled=false;}
}

async function saveExistingUser(){
  if(!currentUser||currentUser.role!=='user')return;const button=$('saveChangesButton');button.disabled=true;showStatus('Saving user access...');
  try{
    const payload={p_user_id:Number(currentUser.id),p_active:$('accountActive').checked,p_permissions:getPermissionPayload(),p_department_access:[],p_project_access:[]};
    const {error}=await client.rpc('save_user_access',payload);if(error)throw error;
    showStatus('User access saved successfully.','success');await loadManagementData();await openExistingUser(Number(currentUser.id));
  }catch(error){showStatus('Save failed: '+(error.message||'Unknown error'),'error');}
  finally{if($('saveChangesButton'))$('saveChangesButton').disabled=false;}
}

async function resetUserPassword(){
  if(!currentUser||currentUser.role!=='user')return;
  const new_password=prompt('Enter the new password (minimum 6 characters, letters and numbers):');if(new_password===null)return;
  if(!validPassword(new_password)){alert('Password must contain at least 6 characters, including letters and numbers.');return;}
  const confirmation=prompt('Confirm the new password:');if(confirmation===null)return;if(new_password!==confirmation){alert('Password confirmation does not match.');return;}
  const button=$('resetPasswordButton');button.disabled=true;
  try{const {data,error}=await client.functions.invoke('admin-reset-user-password',{body:{user_id:Number(currentUser.id),new_password}});if(error)throw await edgeFunctionError(error);if(!data?.success)throw new Error(data?.error||'Password reset was not confirmed.');alert('Password reset successfully. The user will be required to change it at next sign-in.');}
  catch(error){alert('Password reset failed: '+(error.message||'Unknown error'));}
  finally{if($('resetPasswordButton'))$('resetPasswordButton').disabled=false;}
}

async function edgeFunctionError(error){let message=error.message||'The server returned an error.';if(error.context&&typeof error.context.json==='function'){try{const body=await error.context.json();if(body?.error)message=body.error;}catch(_){}}return new Error(message);}

async function deleteUser(){
  if(!currentUser||currentUser.role!=='user')return;
  const label=currentUser.full_name||currentUser.username||('User '+currentUser.id);
  if(!confirm(`Delete user "${label}" permanently? This removes the Auth account, profile, permissions and project/department assignments.`))return;
  const button=$('deleteUserButton');button.disabled=true;showStatus('Deleting user account...');
  try{
    const {data,error}=await client.functions.invoke('delete-user',{body:{user_id:Number(currentUser.id)}});
    if(error)throw await edgeFunctionError(error);
    if(!data?.success)throw new Error(data?.error||'User deletion was not confirmed.');
    currentUser=null;
    await loadManagementData();
    showView('list');
    alert('User deleted successfully.');
  }catch(error){
    showStatus('Delete failed: '+(error.message||'Unknown error'),'error');
    if($('deleteUserButton'))$('deleteUserButton').disabled=false;
  }
}

$('addUserButton').addEventListener('click',openAddUser);
$('returnToListButton').addEventListener('click',()=>showView('list'));
$('backButton').addEventListener('click',()=>location.href='dashboard.html');
$('logoutButton').addEventListener('click',async()=>{const {error}=await client.auth.signOut();sessionStorage.removeItem('pe_login_verified');sessionStorage.removeItem('pe_user_role');sessionStorage.removeItem('pe_username');sessionStorage.removeItem('pe_full_name');if(error){alert('Sign out failed: '+error.message);return;}location.replace('login.html');});
initializePage().catch(error=>fail(error.message||'Unexpected initialization error.'));
</script>
</body>
</html>
