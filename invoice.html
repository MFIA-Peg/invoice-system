<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice Entry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f8;
padding:20px;
margin:0;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}

label{
display:block;
font-weight:bold;
margin-bottom:5px;
}

input,
select,
textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

button{
padding:12px 20px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
}

.save-btn{
background:#16a34a;
}

.back-btn{
background:#2563eb;
}

</style>

</head>

<body>

<div class="container">

<h1>Add Invoice</h1>

<div class="row">

<div>
<label>PO Number</label>
<input id="po_no" readonly>
</div>

<div>
<label>Project ID</label>
<input id="project_id" readonly>
</div>

</div>

<div class="row">

<div>
<label>Invoice Number</label>
<input id="invoice_no">
</div>

<div>
<label>Status</label>
<select
id="status"
onchange="toggleCompletedDate()">
<option>Draft</option>
<option>Submitted</option>
<option>Approved</option>
<option>Partially Paid</option>
<option>Paid</option>
<option>Cancelled</option>
</select>
</div>

</div>

<div class="row">

<div>
<label>Invoice Amount</label>
<input
id="invoice_amount"
type="number">
</div>

<div>
<label>Paid Amount</label>
<input
id="paid_amount"
type="number"
value="0">
</div>

</div>

<div class="row">

<div>
<label>Start Date</label>
<input
id="start_date"
type="date">
</div>

<div id="completedDateContainer">

<label>Completed Date</label>

<input
id="completed_date"
type="date">

</div>

</div>

<div class="row">

<div>
<label>Approval Date</label>
<input
id="approval_date"
type="date">
</div>

<div>
<label>Payment Terms (Days)</label>

<select id="payment_term">

<option value="30">
30 Days
</option>

<option value="45">
45 Days
</option>

<option value="60">
60 Days
</option>

<option value="90">
90 Days
</option>

<option value="120">
120 Days
</option>

</select>
</div>

</div>

<label>Description</label>

<textarea
id="description"
rows="4"></textarea>

<br><br>

<button
class="back-btn"
onclick="window.history.back()">
Back
</button>

<button
class="save-btn"
onclick="saveInvoice()">
Save Invoice
</button>

<p id="message"></p>

</div>

<script>

const SUPABASE_URL =
"https://hxhfjmtjibwkkbpakopt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const params =
new URLSearchParams(
window.location.search
);

const projectId =
params.get("project_id") || "";

document.getElementById(
"po_no"
).value =
params.get("po_no") || "";

document.getElementById(
"project_id"
).value =
projectId;
  
async function getProjectName(){

const projectId =
document.getElementById(
"project_id"
).value;

const { data } =
await supabaseClient
.from("projects")
.select("project_name")
.eq("id",projectId)
.single();

if(data){

return data.project_name;

}

return "";

}
function toggleCompletedDate(){

const status =
document.getElementById(
"status"
).value;

const container =
document.getElementById(
"completedDateContainer"
);

if(status === "Paid"){

container.style.display =
"block";

}else{

container.style.display =
"none";

document.getElementById(
"completed_date"
).value =
"";

}

}  
async function saveInvoice(){

const projectName =
await getProjectName();

const invoiceNo =
document.getElementById(
"invoice_no"
).value.trim();

if(!invoiceNo){

alert(
"Invoice Number Required"
);

return;

}

const { error } =
await supabaseClient
.from("invoices")
.insert([{

invoice_no:
invoiceNo,

status:
document.getElementById(
"status"
).value,

po_no:
document.getElementById(
"po_no"
).value,

description:
document.getElementById(
"description"
).value,

start_date:
document.getElementById(
"start_date"
).value || null,

completed_date:
document.getElementById(
"completed_date"
).value || null,

invoice_amount:
Number(
document.getElementById(
"invoice_amount"
).value || 0
),

paid_amount:
Number(
document.getElementById(
"paid_amount"
).value || 0
),

approval_date:
document.getElementById(
"approval_date"
).value || null,

payment_terms:
Number(
document.getElementById(
"payment_term"
).value
),

erp:false,

project_id:
Number(
document.getElementById(
"project_id"
).value
),

project_name:
projectName

}]);

const msg =
document.getElementById(
"message"
);

if(error){

msg.style.color =
"red";

msg.innerHTML =
error.message;

return;

}

msg.style.color =
"green";

msg.innerHTML =
"Invoice Saved Successfully";

}
toggleCompletedDate();

</script>

</body>
</html>
