<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Energy | Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
    margin:0;font-family:Arial;background:#eef2f7;
    min-height:100vh;display:flex;align-items:center;
    justify-content:center;
}
.login-box {
    background:white;width:360px;padding:35px;
    border-radius:12px;box-shadow:0 5px 25px #0002;
}
h2{color:#10243a}
p{color:#667085;font-size:14px}
label{display:block;margin:15px 0 7px;font-weight:bold;font-size:13px}
input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:13px;margin-top:20px;background:#1769aa;color:white;border:0;border-radius:6px;cursor:pointer;font-weight:bold}
button:disabled{opacity:.6}
a{display:block;text-align:center;margin-top:18px;color:#1769aa;font-size:13px}
#message{margin-top:15px;font-size:13px;line-height:1.5}
.footer{text-align:center;margin-top:25px;color:#999;font-size:11px}
</style>
</head>
<body>

<div class="login-box">
<h2>Power Energy</h2>
<p>Invoice Management System<br>Sign in to continue</p>

<form id="loginForm">
<label>Email Address</label>
<input type="email" id="email" required>

<label>Password</label>
<input type="password" id="password" required>

<button type="submit" id="loginButton">Sign In</button>
</form>

<a href="#" id="forgotPassword">Forgot Password?</a>
<div id="message"></div>
<div class="footer">Power Energy Invoice System</div>
</div>

<script>
const SUPABASE_URL = "https://hxhfjmtjibwkkbpakopt.supabase.co";
const SUPABASE_KEY = "sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const message = document.getElementById("message");
// A login page visit always requires an explicit password entry.
sessionStorage.removeItem("pe_login_verified");

function showMessage(text, color) {
    message.textContent = text;
    message.style.color = color;
}

async function checkProfile(user) {
    const {data: profile, error} = await client
        .from("users_profile")
        .select("username, full_name, role, active")
        .eq("auth_user_id", user.id)
        .maybeSingle();

    if(error) throw new Error("Unable to verify user profile.");
    if(!profile) throw new Error("User profile not found.");
    if(profile.active !== true) throw new Error("Account is inactive.");

    sessionStorage.setItem("pe_user_role", profile.role);
    sessionStorage.setItem("pe_username", profile.username);
    sessionStorage.setItem("pe_full_name", profile.full_name || "");
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const button = document.getElementById("loginButton");
    button.disabled = true;
    button.textContent = "Signing in...";

    try {
        const {data, error} = await client.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
        });

        if(error) throw error;

        await checkProfile(data.user);
        sessionStorage.setItem("pe_login_verified", "true");

        showMessage("Login successful. Opening dashboard...", "green");
        window.location.replace("dashboard.html");

    } catch(error) {
        await client.auth.signOut();
        showMessage(error.message || "Login failed.", "red");
        button.disabled = false;
        button.textContent = "Sign In";
    }
});

document.getElementById("forgotPassword").addEventListener("click", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();

    if(!email) {
        showMessage("Enter your email address first.", "red");
        document.getElementById("email").focus();
        return;
    }

    try {
        showMessage("Sending recovery email...", "#1769aa");

        const {error} = await client.auth.resetPasswordForEmail(email, {
            redirectTo: "https://mfia-peg.github.io/invoice-system/reset-password.html"
        });

        if(error) throw error;

        showMessage("Recovery email sent. Open the latest email and follow its link.", "green");

    } catch(error) {
        showMessage(error.message || "Unable to send recovery email.", "red");
    }
});

// Do not auto-redirect based on a previously persisted Supabase session.
// The user must submit the login form on every fresh visit to this page.

</script>
</body>
</html>
