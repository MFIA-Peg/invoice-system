<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Energy | Financial Reports</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#14263d;--blue:#2563eb;--teal:#0f766e;--bg:#f1f5f9;--line:#e2e8f0;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#0f172a;font:14px Arial,sans-serif}.wrap{max-width:1600px;margin:auto;padding:18px}.top,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0f172a0a}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0 0 6px}h2{font-size:17px;margin:0 0 13px}.muted{color:var(--muted);font-size:12px}.nav{position:sticky;top:0;z-index:5;background:var(--navy);padding:9px;display:flex;gap:6px;flex-wrap:wrap}.nav a,.nav button{font:600 12px Arial;text-decoration:none;color:white;background:#1e3a5f;padding:8px 10px;border:0;border-radius:6px;cursor:pointer}.nav button.export{background:var(--teal)}.nav button.logout{background:#b91c1c}.filters{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:10px}.field label{display:block;font-weight:bold;font-size:12px;color:#475569;margin-bottom:5px}.field input,.field select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px;background:white}.actions,.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button,.tabs button{border:0;border-radius:6px;padding:9px 12px;background:var(--blue);color:white;font-weight:bold;cursor:pointer}.actions .secondary{background:#64748b}.tabs button{background:#e2e8f0;color:#334155}.tabs button.active{background:var(--navy);color:white}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{border:1px solid var(--line);border-radius:9px;padding:13px}.kpi span{display:block;color:var(--muted);font-size:12px}.kpi b{display:block;font-size:19px;color:var(--teal);margin-top:7px;overflow-wrap:anywhere}.table-wrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:8px;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}th{position:sticky;top:0;background:var(--navy);color:white;z-index:1}td.num{text-align:right;font-variant-numeric:tabular-nums}a.record{color:#1d4ed8;font-weight:bold;cursor:pointer}.status{padding:10px;border-radius:7px;background:#eff6ff;color:#1e40af;margin-bottom:12px}.error{background:#fef2f2;color:#991b1b}.detail-backdrop{display:none;position:fixed;inset:0;background:#0f172a99;z-index:20;padding:18px;overflow:auto}.detail{background:white;max-width:900px;margin:30px auto;padding:20px;border-radius:10px}.detail table{min-width:0}.detail button{border:0;border-radius:6px;padding:8px 11px;background:#64748b;color:white;cursor:pointer}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:900px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.wrap{padding:9px}.filters,.kpis{grid-template-columns:1fr}.top,.panel{padding:13px}}
</style>
</head>
<body>
<nav class="nav" aria-label="Main navigation">
<a href="dashboard.html">Dashboard</a><a href="reports.html?report=departments">Departments</a><a href="reports.html?report=customers">Customers</a><a href="companies.html">Projects</a><a href="reports.html?report=pos">Purchase Orders</a><a href="reports.html?report=open">Invoices</a><a href="collections.html">Collections</a><a href="reports.html">Reports</a><a id="userManagementLink" href="user-management.html" hidden>User Management</a><button class="export" onclick="exportToExcel()">Export to Excel</button><button onclick="loadReports()">Refresh</button><button class="logout" onclick="logoutUser()">Sign Out</button>
</nav>
<main class="wrap">
<header class="top"><div><h1>Financial Reports</h1><div id="signedInUser" class="muted">Verifying session...</div></div><div class="muted" id="rowCount"></div></header>
<div id="message" class="status">Loading report data...</div>
<section class="panel"><h2>Filters</h2><div class="filters">
<div class="field"><label for="companyFilter">Company</label><select id="companyFilter"><option value="">All companies</option></select></div>
<div class="field"><label for="departmentFilter">Department</label><select id="departmentFilter"><option value="">All departments</option></select></div>
<div class="field"><label for="projectFilter">Project</label><select id="projectFilter"><option value="">All projects</option></select></div>
<div class="field"><label for="dateFrom">Date from</label><input id="dateFrom" type="date"></div>
<div class="field"><label for="dateTo">Date to</label><input id="dateTo" type="date"></div>
</div><div class="actions"><button onclick="renderReports()">Apply Filters</button><button class="secondary" onclick="clearFilters()">Clear Filters</button></div></section>
<section class="panel"><h2 id="summaryTitle">Report Summary</h2><div class="kpis" id="kpis"></div></section>
<section class="panel"><div class="tabs"><button data-report="open">Open Invoices Report</button><button data-report="closed">Closed Invoices Report</button><button data-report="pos">Purchase Orders Report</button><button data-report="customers">Customers Summary</button><button data-report="departments">Department Summary</button></div><div id="reportTable" class="table-wrap"></div></section>
</main>
<div class="detail-backdrop" id="detailBackdrop" onclick="if(event.target===this)closeDetails()"><div class="detail"><div id="detailContent"></div><button onclick="closeDetails()">Close</button></div></div>
<script>
const SUPABASE_URL='https://hxhfjmtjibwkkbpakopt.supabase.co';
const SUPABASE_KEY='sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let profile=null,projects=[],pos=[],invoices=[],collections=[],activeReport='open';
const $=id=>document.getElementById(id), n=v=>Number(v||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('en-SA',{style:'currency',currency:'SAR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n(v));
const date=s=>s?String(s).slice(0,10):'';
function manager(){return profile?.role==='finance_manager'}
async function fetchAll(table,columns){let all=[],start=0;while(true){const {data,error}=await db.from(table).select(columns).order('id').range(start,start+999);if(error)throw error;all.push(...(data||[]));if(!data||data.length<1000)break;start+=1000;if(start>100000)throw Error('More than 100,000 rows; narrow the filters or contact the administrator.');}return all}
async function initialize(){try{if(sessionStorage.getItem('pe_login_verified')!=='true')throw Error('Please sign in first.');const {data:{session},error}=await db.auth.getSession();if(error||!session)throw Error('Session expired.');const {data:p,error:pe}=await db.from('users_profile').select('id,username,full_name,role,active').eq('auth_user_id',session.user.id).maybeSingle();if(pe||!p||p.active!==true)throw Error('Active user profile not found.');profile=p;sessionStorage.setItem('pe_user_role',p.role||'');$('signedInUser').textContent=`Signed in: ${p.full_name||p.username} · Role: ${p.role}`;$('userManagementLink').hidden=!manager();const params=new URLSearchParams(location.search);const requested=params.get('report');if(['open','closed','pos','customers','departments'].includes(requested))activeReport=requested;await loadReports();}catch(e){$('message').textContent=e.message;$('message').classList.add('error');setTimeout(()=>location.replace('login.html'),1800)}}
async function loadReports(){const msg=$('message');msg.textContent='Loading all records permitted for your account...';msg.classList.remove('error');try{const results=await Promise.all([fetchAll('projects','id,project_name,company,department,status'),fetchAll('pos','id,po_no,project_id,project_name,company,department,po_value_ex_vat,vat,po_date,expiry_date,status,archive,advance_payment_percentage,advance_received_amount'),fetchAll('invoice_details_with_retention','id,invoice_no,status,po_no,description,start_date,completed_date,invoice_amount,paid_amount,approval_date,payment_terms,company,department,due_date,project_id,project_name,vat_applicable,vat_amount,invoice_total,retention_amount,retention_vat,retention_due_date,retention_released_amount,retention_total,net_payable,retention_balance,advance_payment_percentage,advance_amount,advance_amortisation,net_invoice_amount,vat_after_advance,invoice_total_after_advance,collection_balance_after_advance,net_payable_after_advance,payment_status_after_advance'),fetchAll('invoice_collections','id,invoice_id,collection_date,amount,payment_method,reference_no,notes,created_at')]);[projects,pos,invoices,collections]=results;populateFilters();renderReports();msg.textContent='Loaded records visible under your database permissions (RLS).';}catch(e){msg.textContent='Unable to load report data: '+e.message;msg.classList.add('error');console.error(e)}}
function populateFilters(){for(const [id,values,label] of [['companyFilter',[...projects.map(x=>x.company),...pos.map(x=>x.company)],'All companies'],['departmentFilter',[...projects.map(x=>x.department),...pos.map(x=>x.department)],'All departments'],['projectFilter',projects.map(x=>x.project_name),'All projects']]){const el=$(id),old=el.value,vals=[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(vals.includes(old))el.value=old}}
function context(){const company=$('companyFilter').value,department=$('departmentFilter').value,project=$('projectFilter').value,from=$('dateFrom').value,to=$('dateTo').value;const pmap=new Map(projects.map(p=>[Number(p.id),p])),pomap=new Map(pos.map(p=>[String(p.po_no),p]));const eligible=(record,recordDate)=>{const po=pomap.get(String(record.po_no));const pr=pmap.get(Number(record.project_id||po?.project_id));const co=record.company||po?.company||pr?.company||'';const dep=record.department||po?.department||pr?.department||'';const pn=record.project_name||po?.project_name||pr?.project_name||'';const d=date(recordDate);return(!company||co===company)&&(!department||dep===department)&&(!project||pn===project)&&(!from||d>=from)&&(!to||d<=to)};const filteredInvoices=invoices.filter(i=>eligible(i,i.start_date||i.approval_date));const filteredPOs=pos.filter(p=>eligible(p,p.po_date));return{filteredInvoices,filteredPOs,pmap,pomap}}
function collectionsSum(id){return collections.filter(c=>Number(c.invoice_id)===Number(id)).reduce((s,c)=>s+n(c.amount),0)}
function reportRows(){const {filteredInvoices,filteredPOs,pmap,pomap}=context();if(activeReport==='open')return filteredInvoices.filter(i=>i.status!=='Completed');if(activeReport==='closed')return filteredInvoices.filter(i=>i.status==='Completed');if(activeReport==='pos')return filteredPOs;if(activeReport==='customers'||activeReport==='departments'){const groups=new Map(),keyOf=(i)=>{const po=pomap.get(String(i.po_no)),pr=pmap.get(Number(i.project_id||po?.project_id));return activeReport==='customers'?(i.company||po?.company||pr?.company||'Unassigned'):(i.department||po?.department||pr?.department||'Unassigned')};filteredInvoices.forEach(i=>{const key=keyOf(i);if(!groups.has(key))groups.set(key,{name:key,invoices:0,open:0,closed:0,paid:0,collections:0,outstanding:0,retention:0});const g=groups.get(key);g.invoices++;if(i.status==='Completed')g.closed++;else g.open++;g.paid+=n(i.paid_amount);g.collections+=collectionsSum(i.id);g.outstanding+=n(i.collection_balance_after_advance);g.retention+=n(i.retention_balance)});return [...groups.values()].sort((a,b)=>a.name.localeCompare(b.name))}return[]}
function renderReports(){const rows=reportRows(),title={open:'Open Invoices Report',closed:'Closed Invoices Report',pos:'Purchase Orders Report',customers:'Customers Summary',departments:'Department Summary'}[activeReport];$('summaryTitle').textContent=title+' — Summary';$('rowCount').textContent=`${rows.length} matching records`;document.querySelectorAll('[data-report]').forEach(b=>b.classList.toggle('active',b.dataset.report===activeReport));const sum=(fn)=>rows.reduce((s,x)=>s+fn(x),0);let cards=[];if(activeReport==='pos'){cards=[['Purchase Orders',rows.length],['PO Value',sum(x=>n(x.po_value_ex_vat))],['Advance Contract Value',sum(x=>n(x.po_value_ex_vat)*n(x.advance_payment_percentage)/100)],['Open POs',rows.filter(x=>String(x.status||'Open').toLowerCase()!=='closed').length]];}else if(activeReport==='customers'||activeReport==='departments'){cards=[['Groups',rows.length],['Invoices',sum(x=>x.invoices)],['Collections',sum(x=>x.collections)],['Open Balance',sum(x=>x.outstanding)]];}else{cards=[['Invoices',rows.length],['Invoice Total',sum(x=>n(x.invoice_total_after_advance))],['Paid Amount',sum(x=>n(x.paid_amount))],['Collection Balance',sum(x=>n(x.collection_balance_after_advance))],['Retention Balance',sum(x=>n(x.retention_balance))],['Collection Transactions',sum(x=>collections.filter(c=>Number(c.invoice_id)===Number(x.id)).length)]];}$('kpis').innerHTML=cards.map(([l,v])=>`<div class="kpi"><span>${esc(l)}</span><b>${typeof v==='number'&&Number.isInteger(v)&&['Invoices','Groups','Purchase Orders','Open POs','Collection Transactions'].includes(l)?v:money(v)}</b></div>`).join('');renderTable(rows)}
function renderTable(rows){const target=$('reportTable');if(!rows.length){target.innerHTML='<div class="empty">No records match the selected filters.</div>';return}let head,body;if(activeReport==='pos'){head=['PO Number','Company','Department','Project','PO Date','Value Ex VAT','Invoiced Ex VAT','Remaining Ex VAT','Advance %','Status'];body=rows.map(p=>{const inv=invoices.filter(i=>String(i.po_no)===String(p.po_no)),billed=inv.reduce((s,i)=>s+n(i.invoice_amount),0);return `<tr><td><a class="record" onclick="showPODetail(${Number(p.id)})">${esc(p.po_no)}</a></td><td>${esc(p.company)}</td><td>${esc(p.department)}</td><td>${esc(p.project_name)}</td><td>${esc(date(p.po_date))}</td><td class="num">${money(p.po_value_ex_vat)}</td><td class="num">${money(billed)}</td><td class="num">${money(Math.max(0,n(p.po_value_ex_vat)-billed))}</td><td>${n(p.advance_payment_percentage).toFixed(2)}%</td><td>${esc(p.status||'Open')}</td></tr>`})}else if(activeReport==='customers'||activeReport==='departments'){head=['Name','Invoice Count','Open','Closed','Paid Amount','Collections Recorded','Open Collection Balance','Retention Balance'];body=rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.invoices}</td><td>${r.open}</td><td>${r.closed}</td><td class="num">${money(r.paid)}</td><td class="num">${money(r.collections)}</td><td class="num">${money(r.outstanding)}</td><td class="num">${money(r.retention)}</td></tr>`)}else{head=['Invoice No.','Status','Company','Department','Project','PO No.','Invoice Date','Due Date','Amount Ex VAT','Advance Amortisation','VAT after Advance','Invoice Total','Paid','Collection Total','Collection Balance','Retention Balance'];body=rows.map(i=>`<tr><td><a class="record" onclick="showInvoiceDetail(${Number(i.id)})">${esc(i.invoice_no||'')}</a></td><td>${esc(i.status)}</td><td>${esc(i.company)}</td><td>${esc(i.department)}</td><td>${esc(i.project_name)}</td><td>${esc(i.po_no)}</td><td>${esc(date(i.start_date))}</td><td>${esc(date(i.due_date))}</td><td class="num">${money(i.invoice_amount)}</td><td class="num">${money(i.advance_amortisation)}</td><td class="num">${money(i.vat_after_advance)}</td><td class="num">${money(i.invoice_total_after_advance)}</td><td class="num">${money(i.paid_amount)}</td><td class="num">${money(collectionsSum(i.id))}</td><td class="num">${money(i.collection_balance_after_advance)}</td><td class="num">${money(i.retention_balance)}</td></tr>`)}target.innerHTML=`<table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${body.join('')}</tbody></table>`}
function exportToExcel(){if(!window.XLSX){alert('Excel library did not load. Check your internet connection and try again.');return}const rows=reportRows();if(!rows.length){alert('There are no matching records to export.');return}let data;if(activeReport==='pos'){data=rows.map(p=>{const billed=invoices.filter(i=>String(i.po_no)===String(p.po_no)).reduce((s,i)=>s+n(i.invoice_amount),0);return{'PO Number':p.po_no,Company:p.company,Department:p.department,Project:p.project_name,'PO Date':date(p.po_date),'PO Value Ex VAT':n(p.po_value_ex_vat),'Invoiced Ex VAT':billed,'Remaining Ex VAT':Math.max(0,n(p.po_value_ex_vat)-billed),'Advance %':n(p.advance_payment_percentage),Status:p.status}})}else if(activeReport==='customers'||activeReport==='departments'){data=rows.map(r=>({'Name':r.name,'Invoice Count':r.invoices,Open:r.open,Closed:r.closed,'Paid Amount':r.paid,'Collections Recorded':r.collections,'Open Collection Balance':r.outstanding,'Retention Balance':r.retention}))}else{data=rows.map(i=>({'Invoice No.':i.invoice_no,Status:i.status,Company:i.company,Department:i.department,Project:i.project_name,'PO No.':i.po_no,'Invoice Date':date(i.start_date),'Due Date':date(i.due_date),'Amount Ex VAT':n(i.invoice_amount),'Advance Amortisation':n(i.advance_amortisation),'VAT after Advance':n(i.vat_after_advance),'Invoice Total':n(i.invoice_total_after_advance),Paid:n(i.paid_amount),'Collection Total':collectionsSum(i.id),'Collection Balance':n(i.collection_balance_after_advance),'Retention Balance':n(i.retention_balance)}))}const sheet=XLSX.utils.json_to_sheet(data);const book=XLSX.utils.book_new();XLSX.utils.book_append_sheet(book,sheet,titleSheet());XLSX.writeFile(book,`power-energy-${activeReport}-${new Date().toISOString().slice(0,10)}.xlsx`)}
function titleSheet(){return {open:'Open Invoices',closed:'Closed Invoices',pos:'Purchase Orders',customers:'Customers',departments:'Departments'}[activeReport]}
function showInvoiceDetail(id){const i=invoices.find(x=>Number(x.id)===id);if(!i)return;const cs=collections.filter(c=>Number(c.invoice_id)===id);$('detailContent').innerHTML=`<h2>Invoice ${esc(i.invoice_no)}</h2><p><b>Status:</b> ${esc(i.status)} · <b>PO:</b> ${esc(i.po_no)} · <b>Project:</b> ${esc(i.project_name)}</p><p><b>Invoice total:</b> ${money(i.invoice_total_after_advance)} · <b>Paid:</b> ${money(i.paid_amount)} · <b>Collections:</b> ${money(collectionsSum(id))} · <b>Balance:</b> ${money(i.collection_balance_after_advance)} · <b>Retention:</b> ${money(i.retention_balance)}</p><h3>Collection Transactions</h3>${cs.length?`<table><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th><th>Notes</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(date(c.collection_date))}</td><td>${money(c.amount)}</td><td>${esc(c.payment_method)}</td><td>${esc(c.reference_no)}</td><td>${esc(c.notes)}</td></tr>`).join('')}</tbody></table>`:'<p>No collection transaction rows.</p>'}`;$('detailBackdrop').style.display='block'}
function showPODetail(id){const p=pos.find(x=>Number(x.id)===id);if(!p)return;const linked=invoices.filter(i=>String(i.po_no)===String(p.po_no));$('detailContent').innerHTML=`<h2>Purchase Order ${esc(p.po_no)}</h2><p><b>Company:</b> ${esc(p.company)} · <b>Department:</b> ${esc(p.department)} · <b>Project:</b> ${esc(p.project_name)}</p><p><b>Value:</b> ${money(p.po_value_ex_vat)} · <b>Status:</b> ${esc(p.status||'Open')}</p><h3>Linked Invoices</h3>${linked.length?`<table><thead><tr><th>Invoice</th><th>Status</th><th>Total</th><th>Paid</th><th>Balance</th></tr></thead><tbody>${linked.map(i=>`<tr><td><a class="record" onclick="showInvoiceDetail(${Number(i.id)})">${esc(i.invoice_no)}</a></td><td>${esc(i.status)}</td><td>${money(i.invoice_total_after_advance)}</td><td>${money(i.paid_amount)}</td><td>${money(i.collection_balance_after_advance)}</td></tr>`).join('')}</tbody></table>`:'<p>No linked invoices.</p>'}`;$('detailBackdrop').style.display='block'}
function closeDetails(){$('detailBackdrop').style.display='none'}
function clearFilters(){['companyFilter','departmentFilter','projectFilter','dateFrom','dateTo'].forEach(id=>$(id).value='');renderReports()}
function logoutUser(){db.auth.signOut().finally(()=>{sessionStorage.clear();location.replace('login.html')})}
document.querySelectorAll('[data-report]').forEach(b=>b.addEventListener('click',()=>{activeReport=b.dataset.report;const u=new URL(location.href);u.searchParams.set('report',activeReport);history.replaceState({},'',u);renderReports()}));
initialize();
</script>
</body>
</html>
