<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Energy | Change Initial Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef2f7;font-family:Arial,sans-serif;color:#172b42}.box{width:min(440px,calc(100% - 32px));background:#fff;padding:30px;border-radius:12px;box-shadow:0 5px 25px #0002}h1{font-size:22px;color:#10243a;margin:0 0 8px}p{font-size:14px;color:#667085;line-height:1.5}label{display:block;margin:16px 0 7px;font-size:13px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #cfd8e3;border-radius:6px}button{width:100%;padding:13px;margin-top:20px;background:#1769aa;color:#fff;border:0;border-radius:6px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}#message{font-size:13px;line-height:1.5;margin-top:14px}.error{color:#b42318}.success{color:#16803c}.note{font-size:12px;color:#667085;margin-top:8px}
</style>
</head>
<body>
<main class="box">
  <h1>Change Your Password</h1>
  <p>Your account has a temporary initial password. Set a new password before accessing the Invoice Management System.</p>
  <form id="changeForm" autocomplete="off">
    <label for="newPassword">New Password</label>
    <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
    <label for="confirmPassword">Confirm New Password</label>
    <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
    <div class="note">At least 6 characters, including at least one English letter and one number.</div>
    <button id="submitButton" type="submit">Update Password</button>
  </form>
  <div id="message" aria-live="polite"></div>
</main>
<script>
const SUPABASE_URL="https://hxhfjmtjibwkkbpakopt.supabase.co";
const SUPABASE_KEY="sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const validPassword=value=>value.length>=6&&/[A-Za-z]/.test(value)&&/[0-9]/.test(value);
function message(text,type="error"){$("message").textContent=text;$ ("message").className=type;}
async function initialize(){
  const {data:{session},error}=await client.auth.getSession();
  if(error||!session){location.replace("login.html");return;}
  const {data:profile,error:profileError}=await client.from("users_profile")
    .select("active,must_change_password").eq("auth_user_id",session.user.id).maybeSingle();
  if(profileError||!profile||profile.active!==true){await client.auth.signOut();location.replace("login.html");return;}
  if(profile.must_change_password!==true){location.replace("dashboard.html");return;}
  sessionStorage.setItem("pe_login_verified","true");
}
$("changeForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const password=$("newPassword").value,confirmation=$("confirmPassword").value,button=$("submitButton");
  if(!validPassword(password)){message("Password must contain at least 6 characters, including letters and numbers.");return;}
  if(password!==confirmation){message("Password confirmation does not match.");return;}
  button.disabled=true;button.textContent="Updating...";message("Updating password...","");
  try{
    const {data,error}=await client.functions.invoke("change-initial-password",{body:{new_password:password}});
    if(error){let detail=error.message||"Unable to update password.";if(error.context&&typeof error.context.json==="function"){try{const body=await error.context.json();if(body?.error)detail=body.error;}catch(_){}}throw new Error(detail);}
    if(!data?.success||data.must_change_password!==false)throw new Error(data?.error||"The server did not confirm the password update.");
    message("Password updated. Opening the dashboard...","success");
    setTimeout(()=>location.replace("dashboard.html"),700);
  }catch(error){message(error.message||"Unable to update password.");button.disabled=false;button.textContent="Update Password";}
});
initialize().catch(()=>location.replace("login.html"));
</script>
</body>
</html>
