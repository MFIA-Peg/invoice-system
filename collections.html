<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Energy — Collections</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}
.top,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #0f172a0a}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}button{border:0;border-radius:7px;padding:10px 15px;background:#2563eb;color:white;cursor:pointer;font-weight:600}button.secondary{background:#64748b}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white;font:inherit}.field textarea{min-height:70px}.span-2{grid-column:span 2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#64748b;font-size:13px}.status{margin-top:10px;font-size:13px}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.kpi{border:1px solid #e2e8f0;border-radius:9px;padding:15px}.kpi b{display:block;color:#0f766e;font-size:22px;margin-top:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}th{background:#f8fafc;color:#475569}.right{text-align:right}.empty{padding:18px;text-align:center;color:#64748b}
@media(max-width:900px){.grid,.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{padding:10px}.grid,.form-grid,.kpis{grid-template-columns:1fr}.span-2{grid-column:auto}.top,.panel{padding:14px}}
</style></head><body><main class="wrap">
<header class="top"><div><h1>Power Energy — Collections</h1><div class="muted" id="signedInUser">Verifying session...</div></div>
<div class="actions"><button class="secondary" onclick="location.href='dashboard.html'">Dashboard</button><button class="secondary" onclick="loadCollections()">Refresh</button><button style="background:#b91c1c" onclick="logoutUser()">Sign Out</button></div></header>
<section class="panel"><h2>Collection Summary</h2><div class="kpis"><div class="kpi"><span class="muted">Recorded Collections</span><b id="totalCollected">SAR 0.00</b></div><div class="kpi"><span class="muted">Collection Transactions</span><b id="transactionCount">0</b></div><div class="kpi"><span class="muted">Invoices With Collections</span><b id="invoiceCount">0</b></div></div></section>
<section class="panel"><h2>Record New Collection</h2><div class="form-grid">
<div class="field span-2"><label for="invoiceSelect">Invoice</label><select id="invoiceSelect"><option value="">Loading invoices...</option></select></div>
<div class="field"><label for="collectionDate">Collection Date</label><input type="date" id="collectionDate" required></div>
<div class="field"><label for="collectionAmount">Amount (SAR)</label><input type="number" id="collectionAmount" min="0.01" step="0.01" required></div>
<div class="field"><label for="paymentMethod">Payment Method</label><select id="paymentMethod"><option value="">Select method</option><option>Bank Transfer</option><option>Cheque</option><option>Cash</option><option>Other</option></select></div>
<div class="field"><label for="referenceNo">Reference No.</label><input id="referenceNo" maxlength="100"></div>
<div class="field span-2"><label for="collectionNotes">Notes</label><textarea id="collectionNotes" maxlength="1000"></textarea></div></div>
<div class="muted" id="invoiceBalanceInfo" style="margin-top:10px">Select an invoice to view its current balance.</div><div class="actions"><button id="saveCollectionButton" onclick="saveCollection()">Save Collection</button><button class="secondary" onclick="resetForm()">Clear</button></div><div class="status" id="formStatus"></div></section>
<section class="panel"><h2>Collection Transactions</h2><div class="grid" style="margin-bottom:14px">
<div class="field"><label for="filterCompany">Company</label><select id="filterCompany"><option value="">All Companies</option></select></div><div class="field"><label for="filterProject">Project</label><select id="filterProject"><option value="">All Projects</option></select></div><div class="field"><label for="filterFrom">From Date</label><input type="date" id="filterFrom"></div><div class="field"><label for="filterTo">To Date</label><input type="date" id="filterTo"></div></div>
<div class="actions" style="margin:0 0 12px"><button onclick="renderTransactions()">Apply Filters</button><button class="secondary" onclick="clearFilters()">Clear Filters</button></div><div class="table-wrap" id="transactionsTable"><div class="empty">Loading transactions...</div></div></section>
</main><script>
const SUPABASE_URL="https://hxhfjmtjibwkkbpakopt.supabase.co",SUPABASE_KEY="sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let profile=null,invoices=[],projects=[],pos=[],transactions=[];
const $=id=>document.getElementById(id),money=v=>new Intl.NumberFormat('en-SA',{style:'currency',currency:'SAR',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isManager(){return profile?.role==='finance_manager'}function canAdd(){return isManager()||profile?.permissions?.can_add===true}
function allowedProject(id){return isManager()||profile?.all_projects||profile?.projectIds.has(Number(id))}
function allowedDept(d){return isManager()||profile?.all_departments||profile?.departments.has(String(d||''))}
function invMetrics(i){const po=pos.find(p=>String(p.po_no)===String(i.po_no)),pr=projects.find(p=>Number(p.id)===Number(i.project_id||po?.project_id));const base=Math.max(0,Number(i.invoice_amount||0)-Number(i.advance_amortisation||0)),gross=base+(po?.vat?base*.15:0),ret=Number(i.retention_amount||0)+Number(i.retention_vat||0),col=Number(i.paid_amount||0);return{po,pr,gross,col,balance:Math.max(0,gross-ret-col)}}
async function rows(t,s){const {data,error}=await client.from(t).select(s);if(error)throw error;return data||[]}
function status(t,bad=false){$('formStatus').textContent=t;$('formStatus').style.color=bad?'#b91c1c':'#047857'}
async function initialize(){try{
 if(sessionStorage.getItem('pe_login_verified')!=='true')throw Error('Login verification is missing.');
 const {data:{session},error}=await client.auth.getSession();if(error||!session)throw Error('Session expired.');
 const {data:p,error:pe}=await client.from('users_profile').select('id,username,full_name,role,active,all_projects,all_departments').eq('auth_user_id',session.user.id).maybeSingle();if(pe||!p||!p.active)throw Error('Active user profile not found.');
 profile=p;const [pm,pa,da]=await Promise.all([client.from('user_permissions').select('can_view,can_add,can_edit,can_delete').eq('user_id',p.id).maybeSingle(),client.from('user_project_access').select('project_id').eq('user_id',p.id),client.from('user_department_access').select('department').eq('user_id',p.id)]);
 if(pm.error||pa.error||da.error)throw pm.error||pa.error||da.error;profile.permissions=pm.data||{};profile.projectIds=new Set((pa.data||[]).map(x=>Number(x.project_id)));profile.departments=new Set((da.data||[]).map(x=>String(x.department)));
 if(!isManager()&&!profile.permissions.can_view)throw Error('You do not have View permission.');
 $('signedInUser').textContent=`Signed in: ${p.full_name||p.username} · Role: ${p.role}`;if(!canAdd())$('saveCollectionButton').disabled=true;$('collectionDate').value=new Date().toISOString().slice(0,10);await loadCollections();
 }catch(e){$('signedInUser').textContent=e.message;document.querySelectorAll('main section').forEach(x=>x.style.display='none');setTimeout(()=>location.replace('login.html'),1600)}}
async function loadCollections(){try{
 const [p,po,i,c]=await Promise.all([rows('projects','id,project_name,company,department,status'),rows('pos','id,po_no,project_id,company,department,vat,archive,status'),rows('invoices','id,invoice_no,status,po_no,invoice_amount,paid_amount,project_id,project_name,retention_amount,retention_vat,advance_amortisation'),rows('invoice_collections','id,invoice_id,collection_date,amount,payment_method,reference_no,notes,created_at')]);
 projects=p.filter(x=>allowedProject(x.id)&&allowedDept(x.department));const ids=new Set(projects.map(x=>Number(x.id)));pos=po.filter(x=>ids.has(Number(x.project_id))&&x.archive!==true);invoices=i.filter(x=>ids.has(Number(x.project_id||pos.find(y=>y.po_no===x.po_no)?.project_id)));const invIds=new Set(invoices.map(x=>Number(x.id)));
 transactions=c.filter(x=>invIds.has(Number(x.invoice_id))).sort((a,b)=>String(b.collection_date).localeCompare(String(a.collection_date))||b.id-a.id);
 setFilter('filterCompany',projects.map(x=>x.company),'All Companies');setFilter('filterProject',projects.map(x=>x.project_name),'All Projects');fillInvoices();renderTransactions();renderSummary();
 }catch(e){$('transactionsTable').innerHTML=`<div class="empty">Load failed: ${esc(e.message)}</div>`}}
function setFilter(id,values,label){const el=$(id),old=el.value,vals=[...new Set(values.filter(Boolean))].sort();el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(vals.includes(old))el.value=old}
function fillInvoices(){const old=$('invoiceSelect').value,open=invoices.filter(i=>invMetrics(i).balance>.005);$('invoiceSelect').innerHTML='<option value="">Select an open invoice</option>'+open.map(i=>{const m=invMetrics(i);return `<option value="${i.id}">${esc(i.invoice_no||'No Invoice No.')} · ${esc(i.po_no)} · ${esc(m.pr?.project_name||i.project_name||'')} · ${money(m.balance)}</option>`}).join('');if(open.some(i=>String(i.id)===old))$('invoiceSelect').value=old;updateBalance()}
function updateBalance(){const i=invoices.find(x=>String(x.id)===$('invoiceSelect').value);if(!i){$('invoiceBalanceInfo').textContent='Select an invoice to view its current balance.';return}const m=invMetrics(i);$('invoiceBalanceInfo').textContent=`${m.pr?.company||''} · ${m.pr?.project_name||i.project_name||''} · Invoice total ${money(m.gross)} · Previously collected ${money(m.col)} · Current balance ${money(m.balance)}`}
$('invoiceSelect').addEventListener('change',updateBalance);
async function saveCollection(){if(!canAdd())return status('No Add permission.',true);const id=Number($('invoiceSelect').value),i=invoices.find(x=>Number(x.id)===id),amount=Number($('collectionAmount').value);if(!i)return status('Select an invoice.',true);if(!$('collectionDate').value||!Number.isFinite(amount)||amount<=0)return status('Enter a valid date and amount.',true);const m=invMetrics(i);if(amount>m.balance+.005)return status(`Amount exceeds balance ${money(m.balance)}.`,true);
 const b=$('saveCollectionButton');b.disabled=true;try{const {error}=await client.from('invoice_collections').insert({invoice_id:id,collection_date:$('collectionDate').value,amount,payment_method:$('paymentMethod').value||null,reference_no:$('referenceNo').value.trim()||null,notes:$('collectionNotes').value.trim()||null});if(error)throw error;status('Collection saved.');resetForm(false);await loadCollections()}catch(e){status('Save failed: '+e.message,true)}finally{b.disabled=!canAdd()}}
function resetForm(date=true){$('invoiceSelect').value='';$('collectionAmount').value='';$('paymentMethod').value='';$('referenceNo').value='';$('collectionNotes').value='';if(date)$('collectionDate').value=new Date().toISOString().slice(0,10);updateBalance()}
function renderSummary(){const total=transactions.reduce((s,x)=>s+Number(x.amount||0),0);$('totalCollected').textContent=money(total);$('transactionCount').textContent=transactions.length;$('invoiceCount').textContent=new Set(transactions.map(x=>x.invoice_id)).size}
function renderTransactions(){const im=new Map(invoices.map(i=>[Number(i.id),i])),co=$('filterCompany').value,pr=$('filterProject').value,from=$('filterFrom').value,to=$('filterTo').value;const a=transactions.filter(c=>{const i=im.get(Number(c.invoice_id)),m=i&&invMetrics(i);return i&&(!co||m.pr?.company===co)&&(!pr||m.pr?.project_name===pr)&&(!from||c.collection_date>=from)&&(!to||c.collection_date<=to)});$('transactionsTable').innerHTML=a.length?`<table><thead><tr><th>Date</th><th>Company</th><th>Project</th><th>PO No.</th><th>Invoice No.</th><th>Method</th><th>Reference</th><th class="right">Amount</th><th>Notes</th></tr></thead><tbody>${a.map(c=>{const i=im.get(Number(c.invoice_id)),m=invMetrics(i);return `<tr><td>${esc(c.collection_date)}</td><td>${esc(m.pr?.company)}</td><td>${esc(m.pr?.project_name||i.project_name)}</td><td>${esc(i.po_no)}</td><td>${esc(i.invoice_no)}</td><td>${esc(c.payment_method)}</td><td>${esc(c.reference_no)}</td><td class="right">${money(c.amount)}</td><td>${esc(c.notes)}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No collection transactions found.</div>'}
function clearFilters(){['filterCompany','filterProject','filterFrom','filterTo'].forEach(x=>$(x).value='');renderTransactions()}
async function logoutUser(){const {error}=await client.auth.signOut();if(error)return alert(error.message);sessionStorage.clear();location.replace('login.html')}
initialize();
</script></body></html>
