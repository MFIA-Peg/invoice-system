<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purchase Order Entry V10</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:12px;
}

.container{
    width:100%;
    max-width:none;
    margin:0;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
    text-align:center;
}

.form-section{border:1px solid #dbe3ed;border-radius:9px;padding:16px;margin:16px 0;background:#fbfdff}.form-section h2{font-size:18px;color:#14263d;margin:0 0 14px;border-bottom:1px solid #e2e8f0;padding-bottom:8px}
.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
}

.btn-back{
    background:#2563eb;
}

.btn-save{
    background:#16a34a;
}

.message{
    margin-top:15px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Purchase Order Entry</h1>

<section class="form-section"><h2>1. General Identification Data</h2>
<div class="row"><div><label>PO Number *</label><input id="po_no" type="text"></div><div><label>Company / Customer *</label><input id="company" type="text"></div></div>
<div class="row"><div><label>Department *</label><input id="department" type="text"></div><div><label>Project *</label><select id="project_id"></select></div></div>
<div class="row"><div><label>PO Date</label><input id="po_date" type="date"></div><div><label>Expiry Date</label><input id="expiry_date" type="date"></div></div>
<div class="row"><div><label>PO Status</label><select id="po_status"><option>Open</option><option>Closed</option></select></div><div><label>Notes</label><textarea id="notes" rows="3"></textarea></div></div>
</section>

<section class="form-section"><h2>2. Financial Item Data</h2>
<div class="row"><div><label>PO Value Ex VAT *</label><input id="po_value_ex_vat" type="number" min="0" step="0.01"></div><div><label>VAT</label><select id="vat"><option value="true">Yes</option><option value="false">No</option></select></div></div>
</section>

<section class="form-section"><h2>3. Retention and Advance Payment Deductions</h2>
<div class="row"><div><label>Subject to Retention</label><select id="retention_applicable"><option value="false">No</option><option value="true">Yes</option></select></div><div><label>Retention %</label><input id="retention_percentage" type="number" min="0" max="100" step="0.01" value="0"></div></div>
<div class="row"><div><label>Retention Period (Days)</label><input id="retention_period_days" type="number" min="0" value="0"></div><div><label>Advance Payment %</label><input id="advance_payment_percentage" type="number" min="0" max="100" step="0.01" value="0" oninput="updateAdvancePreview()"></div></div>
<div class="row"><div><label>Advance Payment Amount</label><input id="advance_amount_preview" type="number" readonly value="0.00"></div><div></div></div>
</section>

<button
class="btn-back"
type="button"
onclick="window.location.href='dashboard.html'">
Back To Projects
</button>

<button
class="btn-save"
type="button"
onclick="savePO()">
Save PO
</button>

<div id="message" class="message"></div>

</div>

<script>

const SUPABASE_URL =
"https://hxhfjmtjibwkkbpakopt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const params =
new URLSearchParams(
window.location.search
);

const projectIdFromUrl =
params.get("project_id");

function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
document.getElementById("po_date").value=localToday();
document.getElementById("expiry_date").value=localToday();
document.getElementById("po_value_ex_vat").addEventListener("input",updateAdvancePreview);
function updateAdvancePreview(){const v=Number(document.getElementById("po_value_ex_vat").value||0),p=Number(document.getElementById("advance_payment_percentage").value||0);document.getElementById("advance_amount_preview").value=(v*p/100).toFixed(2);}
loadProjects();

async function loadProjects(){

const { data, error } =
await supabaseClient
.from("projects")
.select("*")
.order("project_name");

if(error){
console.error(error);
return;
}

const projectSelect =
document.getElementById("project_id");

projectSelect.innerHTML = "";

data.forEach(project=>{

projectSelect.innerHTML += `
<option value="${project.id}">
${project.project_name}
</option>
`;

});

if(projectIdFromUrl){

projectSelect.value =
projectIdFromUrl;

projectSelect.disabled = true;

fillProjectData(
projectIdFromUrl
);

}

}

async function fillProjectData(projectId){

const { data, error } =
await supabaseClient
.from("projects")
.select("*")
.eq("id",projectId)
.single();

if(error) return;

document.getElementById(
"company"
).value =
data.company || "";

document.getElementById(
"department"
).value =
data.department || "";

}

document
.getElementById("project_id")
.addEventListener(
"change",
function(){

fillProjectData(
this.value
);

}
);

async function savePO(){

const poNo =
document.getElementById(
"po_no"
).value.trim();

const company =
document.getElementById(
"company"
).value.trim();

const department =
document.getElementById(
"department"
).value.trim();

const poValue =
document.getElementById(
"po_value_ex_vat"
).value;

if(!poNo){

alert(
"PO Number Required"
);

return;

}

if(!poValue){

alert(
"PO Value Required"
);

return;

}

const projectSelect =
document.getElementById(
"project_id"
);

const projectId =
Number(
projectSelect.value
);

const projectName =
projectSelect.options[
projectSelect.selectedIndex
].text;

const { error } =
await supabaseClient
.from("pos")
.insert([{

po_no: poNo,

company: company,

department: department,

project_id: projectId,

project_name: projectName,

po_value_ex_vat:
Number(poValue),

vat:
document
.getElementById("vat")
.value === "true",

po_date:
document
.getElementById("po_date")
.value || null,

expiry_date:
document
.getElementById("expiry_date")
.value || null,

notes:
document
.getElementById("notes")
.value || "",

status:document.getElementById("po_status").value,
retention_applicable:document.getElementById("retention_applicable").value === "true",
retention_percentage:Number(document.getElementById("retention_percentage").value || 0),
retention_period_days:Number(document.getElementById("retention_period_days").value || 0),
advance_payment_percentage:Number(document.getElementById("advance_payment_percentage").value || 0),
archive:document.getElementById("po_status").value === "Closed"

}]);

const msg =
document.getElementById(
"message"
);

if(error){

msg.style.color =
"red";

msg.innerHTML =
error.message;

return;

}

msg.style.color =
"green";

msg.innerHTML =
"PO Saved Successfully";

}

</script>

</body>
</html>
