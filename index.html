<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purchase Order Entry V9</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
    text-align:center;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    background:#16a34a;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

</style>

</head>

<body>

<div class="container">

<h1>Purchase Order Entry</h1>

<div class="row">

<div>
<label>PO Number</label>
<input id="po_no" type="text">
</div>

<div>
<label>Company</label>
<input id="company" type="text">
</div>

</div>

<div class="row">

<div>
<label>Department</label>
<input id="department" type="text">
</div>

<div>
<label>Project</label>
<select id="project_id"></select>
</div>

</div>

<div class="row">

<div>
<label>PO Value Ex VAT</label>
<input id="po_value_ex_vat" type="number">
</div>

<div>
<label>VAT</label>

<select id="vat">
<option value="true">Yes</option>
<option value="false">No</option>
</select>

</div>

</div>

<div class="row">

<div>
<label>PO Date</label>
<input id="po_date" type="date">
</div>

<div>
<label>Expiry Date</label>
<input id="expiry_date" type="date">
</div>

</div>

<label>Notes</label>

<textarea id="notes" rows="5"></textarea>

<br><br>

    <button
type="button"
onclick="goBack()"
style="
background:#2563eb;
margin-right:10px;
">
Back To Projects
</button>

<button onclick="savePO()">
Save PO
</button>
<button onclick="savePO()">
Save PO
</button>

<p id="message"></p>

</div>

<script>

const SUPABASE_URL =
"https://hxhfjmtjibwkkbpakopt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const params =
new URLSearchParams(
window.location.search
);

const projectIdFromUrl =
params.get("project_id");

loadProjects();

async function loadProjects(){

const { data,error } =
await supabaseClient
.from("projects")
.select("*")
.order("project_name");

if(error){
console.log(error);
return;
}

const projectSelect =
document.getElementById("project_id");

projectSelect.innerHTML = "";

data.forEach(project=>{

projectSelect.innerHTML += `
<option value="${project.id}">
${project.project_name}
</option>
`;

});

if(projectIdFromUrl){

projectSelect.value =
projectIdFromUrl;

projectSelect.disabled = true;

fillProjectData(projectIdFromUrl);

}

}

async function fillProjectData(projectId){

const { data,error } =
await supabaseClient
.from("projects")
.select("*")
.eq("id",projectId)
.single();

if(error) return;

document.getElementById(
"company"
).value =
data.company || "";

document.getElementById(
"department"
).value =
data.department || "";

}

document
.getElementById("project_id")
.addEventListener(
"change",
function(){

fillProjectData(
this.value
);

}
);

async function savePO(){

const po_no =
document.getElementById(
"po_no"
).value;

const company =
document.getElementById(
"company"
).value;

const department =
document.getElementById(
"department"
).value;

const project_id =
document.getElementById(
"project_id"
).value;

const project_name =
document.getElementById(
"project_id"
).options[
document.getElementById(
"project_id"
).selectedIndex
].text;

const po_value =
document.getElementById(
"po_value_ex_vat"
).value;

const vat =
document.getElementById(
"vat"
).value === "true";

const po_date =
document.getElementById(
"po_date"
).value;

const expiry_date =
document.getElementById(
"expiry_date"
).value;

const notes =
document.getElementById(
"notes"
).value;

const { error } =
await supabaseClient
.from("pos")
.insert([{

po_no:po_no,
company:company,
department:department,
project_id:Number(project_id),
project_name:project_name,
po_value_ex_vat:Number(po_value),
vat:vat,
po_date:po_date,
expiry_date:expiry_date,
notes:notes

}]);

if(error){

document.getElementById(
"message"
).innerHTML =
error.message;

return;

}

document.getElementById(
"message"
).innerHTML =
"PO Saved Successfully";

setTimeout(function(){

window.location.href =
"dashboard.html";

},1000);

}

</script>

</body>
</html>
