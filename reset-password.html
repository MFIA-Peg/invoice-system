<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Energy | Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
}
.box {
    background: white;
    width: 360px;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,.1);
}
h2 { color: #10243a; }
p { color: #667085; font-size: 14px; line-height: 1.5; }
label {
    display: block;
    margin: 18px 0 7px;
    font-weight: bold;
    font-size: 13px;
}
input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}
button {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    background: #1769aa;
    color: white;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}
button:disabled { opacity: .6; }
#message { margin-top: 16px; font-size: 13px; line-height: 1.5; }
.footer { margin-top: 25px; text-align: center; color: #999; font-size: 11px; }
</style>
</head>

<body>

<div class="box">

<h2>Power Energy</h2>
<p>Reset your account password</p>

<form id="resetForm">

<label>New Password</label>
<input type="password" id="password" minlength="8" required>

<label>Confirm New Password</label>
<input type="password" id="confirmPassword" minlength="8" required>

<button type="submit" id="saveButton" disabled>
Save New Password
</button>

<div id="message"></div>

</form>

<div class="footer">Power Energy Invoice System</div>

</div>

<script>

const SUPABASE_URL =
"https://hxhfjmtjibwkkbpakopt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById("resetForm");
const button = document.getElementById("saveButton");
const message = document.getElementById("message");

let recoveryReady = false;

function showMessage(text, color) {
    message.textContent = text;
    message.style.color = color;
}

async function initializeRecovery() {

    try {

        const params = new URLSearchParams(window.location.search);

        if (params.has("error")) {
            throw new Error(
                params.get("error_description") || "Recovery link is invalid or expired."
            );
        }

        const code = params.get("code");

        if (code) {
            const { error } =
                await client.auth.exchangeCodeForSession(window.location.href);

            if (error) throw error;
        }

        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (!data.session) {
            throw new Error(
                "Recovery session not found. Request a new password reset email."
            );
        }

        recoveryReady = true;
        button.disabled = false;

        showMessage(
            "Enter your new password below.",
            "green"
        );

    } catch (error) {

        showMessage(
            error.message || "Unable to verify recovery link.",
            "red"
        );

    }
}

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!recoveryReady) return;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password.length < 8) {
        showMessage("Password must be at least 8 characters.", "red");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "red");
        return;
    }

    button.disabled = true;
    button.textContent = "Saving...";

    try {

        const { error } = await client.auth.updateUser({
            password: password
        });

        if (error) throw error;

        showMessage(
            "Password updated successfully. Redirecting to login...",
            "green"
        );

        await client.auth.signOut();

        setTimeout(function() {
            window.location.replace("login.html");
        }, 2000);

    } catch (error) {

        showMessage(
            error.message || "Unable to update password.",
            "red"
        );

        button.disabled = false;
        button.textContent = "Save New Password";

    }

});

initializeRecovery();

</script>

</body>
</html>
