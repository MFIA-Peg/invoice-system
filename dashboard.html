<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projects Dashboard V12</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
    margin-right:5px;
}

button:hover{
    background:#1d4ed8;
}

.btn-po{
    background:#16a34a;
}

.btn-po:hover{
    background:#15803d;
}

input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1e293b;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ddd;
    padding:10px;
}

.current-project{
    background:#dbeafe;
    padding:15px;
    border-radius:10px;
}


#invoiceModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;overflow:auto;padding:25px;box-sizing:border-box;}
#invoiceModalContent{background:#fff;max-width:950px;margin:25px auto;padding:25px;border-radius:10px;box-shadow:0 5px 25px rgba(0,0,0,.25);}
.invoice-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;}
.invoice-field label{display:block;font-weight:bold;margin-bottom:6px;}
.invoice-field input,.invoice-field select,.invoice-field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:5px;}
.invoice-field input[type=checkbox]{width:auto;}
.modal-actions{display:flex;gap:8px;margin-top:20px;}
@media(max-width:650px){.invoice-fields{grid-template-columns:1fr;}#invoiceModal{padding:8px;}#invoiceModalContent{padding:15px;}}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Projects Dashboard V12</h1>

<button onclick="addProject()">
Add Project
</button>

<button onclick="loadProjects()">
Refresh
</button>

<input
type="text"
id="searchBox"
placeholder="Search Project"
onkeyup="filterProjects()">

</div>

<div class="card">

<h2>Projects</h2>

<div id="projectsList">
Loading Projects...
</div>

</div>

<div class="card">

<h2>Current Project</h2>

<div id="projectDetails">
No Project Selected
</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://hxhfjmtjibwkkbpakopt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadProjects(){

    const { data, error } =
    await supabaseClient
    .from("projects")
    .select("*")
    .order("id");

    if(error){

        document.getElementById(
        "projectsList"
        ).innerHTML =
        error.message;

        return;
    }

    let html = `
    <table>

    <tr>
        <th>ID</th>
        <th>Project Name</th>
        <th>Company</th>
        <th>Status</th>
        <th>Open</th>
        <th>Add PO</th>
        <th>Status Update</th>
    </tr>
    `;

    data.forEach(project => {

        html += `
        <tr>

        <td>${project.id}</td>

        <td>${project.project_name || ""}</td>

        <td>${project.company || ""}</td>

        <td>${project.status || ""}</td>

        <td>
        <button
        onclick="openProject(${project.id})">
        Open
        </button>
        </td>

        <td>
        <button
        class="btn-po"
        onclick="directAddPO(
        ${project.id},
        '${project.project_name || ""}'
        )">
        Add PO
        </button>
        </td>

        <td>
        <button
        onclick="changeStatus(${project.id})">
        Status
        </button>
        </td>

        </tr>
        `;

    });

    html += "</table>";

    document.getElementById(
    "projectsList"
    ).innerHTML = html;

}

function directAddPO(
projectId,
projectName
){

window.location.href =
"index.html?project_id=" +
projectId +
"&project_name=" +
encodeURIComponent(projectName);

}

async function openProject(projectId){

const { data, error } =
await supabaseClient
.from("projects")
.select("*")
.eq("id", projectId)
.single();

if(error){
    alert(error.message);
    return;
}

document.getElementById(
"projectDetails"
).innerHTML = `

<div class="current-project">

<h3>${data.project_name}</h3>

<p>
<b>Company:</b>
${data.company || ""}
</p>

<p>
<b>Department:</b>
${data.department || ""}
</p>

<p>
<b>Project Manager:</b>
${data.project_manager || ""}
</p>

<p>
<b>Status:</b>
${data.status || ""}
</p>

</div>

<br>

<h3>Purchase Orders</h3>

<div id="poList">
Loading...
</div>
`;

loadPOs(projectId);

}

async function loadPOs(projectId){

const { data, error } =
await supabaseClient
.from("pos")
.select("*")
.eq("project_id", projectId)
.order("id");

if(error){

document.getElementById(
"poList"
).innerHTML =
error.message;

return;

}

if(!data || data.length===0){

document.getElementById(
"poList"
).innerHTML =
"No Purchase Orders";

return;

}

let html = `
<table>

<tr>
<th>PO Number</th>
<th>Company</th>
<th>Value</th>
<th>Date</th>
<th>Invoices</th>
<th>Add Invoice</th>
</tr>
`;

data.forEach(po=>{

html += `
<tr>

<td>${po.po_no || ""}</td>

<td>${po.company || ""}</td>

<td>${po.po_value_ex_vat || 0}</td>

<td>${po.po_date || ""}</td>

<td>
<button
onclick="openInvoices('${po.po_no}')">
Open
</button>
</td>

<td>
<button
class="btn-po"
onclick="addInvoice('${po.po_no}',${projectId})">
Add Invoice
</button>
</td>

</tr>
`;

});

html += "</table>";

document.getElementById(
"poList"
).innerHTML = html;

}

function filterProjects(){

const search =
document.getElementById(
"searchBox"
).value.toLowerCase();

const rows =
document.querySelectorAll(
"#projectsList table tr"
);

rows.forEach((row,index)=>{

if(index===0) return;

row.style.display =
row.innerText
.toLowerCase()
.includes(search)
? ""
: "none";

});

}

function addProject(){

document.getElementById(
"projectModal"
).style.display =
"block";

}

function closeProjectModal(){

document.getElementById(
"projectModal"
).style.display =
"none";

}

async function saveProject(){

const projectName =
document.getElementById(
"new_project_name"
).value.trim();

if(!projectName){

alert(
"Project Name Required"
);

return;

}

const { error } =
await supabaseClient
.from("projects")
.insert([{
project_name:
projectName,

company:
document.getElementById(
"new_company"
).value,

department:
document.getElementById(
"new_department"
).value,

project_manager:
document.getElementById(
"new_project_manager"
).value,

status:
document.getElementById(
"new_status"
).value

}]);

if(error){

alert(error.message);
return;

}

alert(
"Project Saved"
);

closeProjectModal();

loadProjects();

}

async function changeStatus(projectId){

const status =
prompt(
"Enter New Status"
);

if(!status) return;

const { error } =
await supabaseClient
.from("projects")
.update({
status:status
})
.eq("id",projectId);

if(error){

alert(error.message);

return;

}

loadProjects();

}


/* ضع الكود الجديد هنا */

function addInvoice(
poNo,
projectId
){

window.location.href =
"invoice.html?po_no=" +
encodeURIComponent(poNo) +
"&project_id=" +
projectId;

}

async function openInvoices(poNo){

const { data, error } = await supabaseClient
  .from("invoice_details")
  .select("*")
  .eq("po_no", poNo);

if(error){ alert(error.message); return; }
if(!data || data.length===0){ alert("No Invoices Found For " + poNo); return; }

let html = `
<h3>Invoices For ${escapeHtml(poNo)}</h3>
<table>
<tr>
<th>Open</th><th>Invoice No</th><th>Invoice Date</th>
<th>Approval Date</th><th>Payment Terms</th><th>Due Date</th>
<th>Amount</th><th>Paid</th><th>Balance</th><th>Status</th>
</tr>`;

data.forEach(inv=>{
  html += `
  <tr>
    <td><button onclick="showInvoiceDetails(${Number(inv.id)})">Open</button></td>
    <td>${escapeHtml(inv.invoice_no || "")}</td>
    <td>${escapeHtml(inv.start_date || "")}</td>
    <td>${escapeHtml(inv.approval_date || "")}</td>
    <td>${escapeHtml(inv.payment_terms ?? "")}</td>
    <td>${escapeHtml(inv.due_date || "")}</td>
    <td>${Number(inv.invoice_amount || 0).toFixed(2)}</td>
    <td>${Number(inv.paid_amount || 0).toFixed(2)}</td>
    <td>${Number(inv.open_balance || 0).toFixed(2)}</td>
    <td>${escapeHtml(inv.status || "")}</td>
  </tr>`;
});

html += "</table>";
document.getElementById("poList").innerHTML = html;
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

let currentInvoiceId = null;

function toDateInput(value){
  return value ? String(value).slice(0,10) : "";
}

async function showInvoiceDetails(invoiceId){

  const { data, error } = await supabaseClient
    .from("invoice_details")
    .select("*")
    .eq("id", invoiceId)
    .single();

  if(error){
    alert("Could not load invoice: " + error.message);
    return;
  }

  currentInvoiceId = invoiceId;

  const money = value =>
    Number(value || 0).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  const fields = [
    ["invoice_no", "Invoice Number", data.invoice_no || "", "text"],
    ["status", "Invoice Status", data.status || "Draft", "select"],
    ["po_no", "PO Number", data.po_no || "", "readonly"],
    ["project_id", "Project ID", data.project_id ?? "", "readonly"],
    ["project_name", "Project Name", data.project_name || "", "readonly"],
    ["company", "Customer", data.company || "", "readonly"],
    ["start_date", "Invoice Date", toDateInput(data.start_date), "date"],
    ["completed_date", "Completed Date", toDateInput(data.completed_date), "date"],
    ["approval_date", "Approval Date", toDateInput(data.approval_date), "date"],
    ["payment_terms", "Payment Terms (Days)", data.payment_terms ?? "", "number"],

    ["invoice_amount", "Invoice Amount (Excl. VAT)", money(data.invoice_amount), "number"],
    ["vat_applicable", "VAT Applicable", data.vat_applicable ? "Yes" : "No", "readonly"],
    ["vat_amount", "VAT Amount (15%)", money(data.vat_amount), "readonly"],
    ["invoice_total", "Invoice Total (Incl. VAT)", money(data.invoice_total), "readonly"],
    ["paid_amount", "Paid Amount", money(data.paid_amount), "number"],
    ["open_balance", "Remaining Balance", money(data.open_balance), "readonly"],
    ["payment_status", "Payment Status", data.payment_status || "", "readonly"],

    ["erp", "ERP", data.erp ? "true" : "false", "checkbox"],
    ["description", "Description", data.description || "", "textarea"]
  ];

  let formHtml = `
    <h2>Invoice Details</h2>
    <div class="invoice-fields">
  `;

  for(const [key,label,value,type] of fields){

    formHtml += `
      <div class="invoice-field">
        <label for="inv_${key}">${label}</label>
    `;

    if(type === "select"){

      const statuses = [
        "Draft",
        "Submitted",
        "Approved",
        "Partially Paid",
        "Paid",
        "Cancelled"
      ];

      formHtml += `
        <select id="inv_${key}" disabled>
          ${statuses.map(st =>
            `<option ${st===value?'selected':''}>${st}</option>`
          ).join("")}
        </select>
      `;

    } else if(type === "textarea"){

      formHtml += `
        <textarea id="inv_${key}" rows="3" disabled>${escapeHtml(value)}</textarea>
      `;

    } else if(type === "checkbox"){

      formHtml += `
        <input id="inv_${key}" type="checkbox"
          ${value==="true"?"checked":""} disabled>
      `;

    } else {

      formHtml += `
        <input
          id="inv_${key}"
          type="${type==='readonly'?'text':type}"
          value="${escapeHtml(value)}"
          ${type==='readonly'?'readonly':''}
          disabled
        >
      `;
    }

    formHtml += `</div>`;
  }

  formHtml += `
    </div>

    <p id="invoiceEditMessage"></p>

    <div class="modal-actions">
      <button id="invoiceEditButton" onclick="enableInvoiceEdit()">
        Edit
      </button>

      <button id="invoiceSaveButton"
        class="btn-po"
        style="display:none"
        onclick="saveInvoiceChanges()">
        Save Changes
      </button>

      <button onclick="closeInvoiceModal()" style="background:#64748b">
        Close
      </button>
    </div>
  `;

  document.getElementById("invoiceModalContent").innerHTML = formHtml;
  document.getElementById("invoiceModal").style.display = "block";
}

function enableInvoiceEdit(){
  document.querySelectorAll("#invoiceModalContent input:not([readonly]), #invoiceModalContent select, #invoiceModalContent textarea")
    .forEach(el => el.disabled = false);
  document.getElementById("invoiceEditButton").style.display = "none";
  document.getElementById("invoiceSaveButton").style.display = "inline-block";
}

function closeInvoiceModal(){
  document.getElementById("invoiceModal").style.display = "none";
  currentInvoiceId = null;
}

async function saveInvoiceChanges(){
  if(!currentInvoiceId) return;
  const amount = Number(document.getElementById("inv_invoice_amount").value || 0);
  const paid = Number(document.getElementById("inv_paid_amount").value || 0);
  const terms = Number(document.getElementById("inv_payment_terms").value || 0);
  if(amount < 0 || paid < 0 || terms < 0){
    alert("Amounts and payment terms cannot be negative."); return;
  }

  const updates = {
    invoice_no: document.getElementById("inv_invoice_no").value.trim(),
    status: document.getElementById("inv_status").value,
    start_date: document.getElementById("inv_start_date").value || null,
    completed_date: document.getElementById("inv_completed_date").value || null,
    approval_date: document.getElementById("inv_approval_date").value || null,
    payment_terms: terms,
    invoice_amount: amount,
    paid_amount: paid,
    erp: document.getElementById("inv_erp").checked,
    description: document.getElementById("inv_description").value
  };

  const { error } = await supabaseClient
    .from("invoices").update(updates).eq("id", currentInvoiceId);
  if(error){
    document.getElementById("invoiceEditMessage").textContent = "Save failed: " + error.message;
    document.getElementById("invoiceEditMessage").style.color = "red";
    return;
  }

  document.getElementById("invoiceEditMessage").textContent = "Invoice updated successfully.";
  document.getElementById("invoiceEditMessage").style.color = "green";
  const poNo = document.getElementById("inv_po_no").value;
  await openInvoices(poNo);
  closeInvoiceModal();
}

loadProjects();

</script>

<div id="projectModal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
">

<div
style="
background:white;
width:500px;
max-width:90%;
margin:50px auto;
padding:20px;
border-radius:10px;
">

<h2>Add Project</h2>

<input
id="new_project_name"
type="text"
placeholder="Project Name">

<br><br>

<input
id="new_company"
type="text"
placeholder="Company">

<br><br>

<input
id="new_department"
type="text"
placeholder="Department">

<br><br>

<input
id="new_project_manager"
type="text"
placeholder="Project Manager">

<br><br>

<select id="new_status">
<option value="Active">Active</option>
<option value="Pending">Pending</option>
<option value="Closed">Closed</option>
</select>

<br><br>

<button onclick="saveProject()">
Save
</button>

<button
style="background:red"
onclick="closeProjectModal()">
Cancel
</button>

</div>

</div>


<div id="invoiceModal" onclick="if(event.target===this) closeInvoiceModal()">
  <div id="invoiceModalContent"></div>
</div>

</body>
</html>
