async function refreshDashboard(){
  const button = document.getElementById("refreshButton");
  if(button){ button.disabled = true; button.textContent = "Refreshing..."; }
  try{
    await loadProjects();
    if(currentProjectId !== null && currentProjectId !== undefined){
      await openProject(currentProjectId);
      if(currentInvoicePoNo){
        await openInvoices(currentInvoicePoNo);
      }
    }
  }catch(err){
    alert("Refresh failed: " + (err?.message || err));
  }finally{
    if(button){ button.disabled = false; button.textContent = "Refresh"; }
  }
}

      <div class="invoice-field"><label>VAT Applicable</label><input value="${currentInvoiceVat ? "Yes - 15%" : "No"}" readonly></div>
      <div class="invoice-field"><label>VAT Amount</label><input id="new_inv_vat" value="0.00" readonly></div>

      <div class="invoice-field"><label>Remaining Balance</label><input id="new_inv_balance" value="0.00" readonly></div>
      <div class="invoice-field"><label>Invoice Date</label><input id="new_inv_start_date" type="date"></div>
      <div class="invoice-field"><label>Approval Date</label><input id="new_inv_approval_date" type="date" oninput="updateNewInvoiceTotals()"></div>
      <div class="invoice-field"><label>Payment Terms (Days)</label><input id="new_inv_terms" type="number" min="0" value="60" oninput="updateNewInvoiceTotals()"></div>
      <div class="invoice-field"><label>Due Date</label><input id="new_inv_due_date" value="" readonly></div>
      <div class="invoice-field"><label>Overdue Status</label><input id="new_inv_overdue_status" value="Not Due" readonly></div>
      <div class="invoice-field"><label>Completed Date</label><input id="new_inv_completed_date" type="date"></div>
      <div class="invoice-field"><label>Description</label><textarea id="new_inv_description" rows="2"></textarea></div>
    </div>
    <p id="newInvoiceMessage"></p>

    </div>`;

}

function updateNewInvoiceTotals(){
  const amount = Number(document.getElementById("new_inv_amount")?.value || 0);
  const paid = Number(document.getElementById("new_inv_paid")?.value || 0);
  const vat = currentInvoiceVat ? amount * 0.15 : 0;
  const total = amount + vat;
  document.getElementById("new_inv_vat").value = vat.toFixed(2);
  document.getElementById("new_inv_total").value = total.toFixed(2);
  const balance = total - paid;
  document.getElementById("new_inv_balance").value = balance.toFixed(2);
  const dueDate = calculateDueDate(
    document.getElementById("new_inv_approval_date").value,
    document.getElementById("new_inv_terms").value
  );
  document.getElementById("new_inv_due_date").value = dueDate;
  document.getElementById("new_inv_overdue_status").value = getOverdueStatus(dueDate, balance);
}

function calculateDueDate(approvalDate, paymentTerms){
  if(!approvalDate || paymentTerms === "" || paymentTerms === null || paymentTerms === undefined) return "";
  const date = new Date(approvalDate + "T12:00:00");
  if(Number.isNaN(date.getTime())) return "";
  date.setDate(date.getDate() + Number(paymentTerms || 0));
  const year = date.getFullYear();
  const month = String(date.getMonth()+1).padStart(2,"0");
  const day = String(date.getDate()).padStart(2,"0");
  return `${year}-${month}-${day}`;
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

}
function toDateInput(value){

}

function updateExistingInvoiceTotals(){
  const amount = Number(document.getElementById("inv_invoice_amount")?.value || 0);
  const paid = Number(document.getElementById("inv_paid_amount")?.value || 0);
  const po = window.currentPOForInvoice || {};
  const advanceAmortisation = calculateAdvanceAmortisation(amount,po,window.currentAdvanceAvailable??0);
  const netInvoiceAmount = Math.max(0,amount-advanceAmortisation);
  const vat = currentInvoiceVat ? netInvoiceAmount * 0.15 : 0;
  const total = netInvoiceAmount + vat;
  const pct = po.retention_applicable ? Number(po.retention_percentage || 0) / 100 : 0;
  const retentionBase = amount * pct;
  const retentionVat = currentInvoiceVat ? retentionBase * 0.15 : 0;
  const approval = document.getElementById("inv_approval_date")?.value || "";
  const retentionDue = approval && po.retention_applicable
    ? calculateDueDate(approval, Number(po.retention_period_days || 0)) : "";
  const dueDate = calculateDueDate(approval, document.getElementById("inv_payment_terms")?.value);
  const balance = Math.max(0, total - paid);
  const set=(id,value)=>{const el=document.getElementById(id);if(el)el.value=value;};
  set("inv_advance_amortisation", advanceAmortisation.toFixed(2));
  set("inv_net_invoice_amount", netInvoiceAmount.toFixed(2));
  set("inv_vat_after_advance", vat.toFixed(2));
  set("inv_invoice_total_after_advance", total.toFixed(2));
  set("inv_vat_amount", vat.toFixed(2));
  set("inv_invoice_total", total.toFixed(2));
  set("inv_open_balance", balance.toFixed(2));
  set("inv_net_payable_after_advance", Math.max(0,total-retentionBase-retentionVat).toFixed(2));
  set("inv_payment_status", paid <= 0 ? "Unpaid" : balance <= 0.005 ? "Paid" : "Partially Paid");
  set("inv_due_date", dueDate);
  set("inv_overdue_status", getOverdueStatus(dueDate, balance));
  set("inv_retention_amount", retentionBase.toFixed(2));
  set("inv_retention_vat", retentionVat.toFixed(2));
  set("inv_retention_total", (retentionBase+retentionVat).toFixed(2));
  set("inv_retention_due_date", retentionDue);
  set("inv_net_payable", Math.max(0,total-retentionBase-retentionVat).toFixed(2));
}

function getOverdueStatus(dueDate, balance){
  if(Number(balance) <= 0.005) return "Paid";
  if(!dueDate) return "Due Date Not Set";
  const today = new Date();
  const todayText = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  return String(dueDate).slice(0,10) < todayText ? "Overdue" : "Not Overdue";
}

async function saveInvoiceChanges(){
  if(!currentInvoiceId) return;
  const amount = Number(document.getElementById("inv_invoice_amount").value || 0);
  const paid = Number(document.getElementById("inv_paid_amount").value || 0);
  const terms = Number(document.getElementById("inv_payment_terms").value || 0);
  if(amount < 0 || paid < 0 || terms < 0){
    alert("Amounts and payment terms cannot be negative."); return;
  }

  // Recalculate retention at save time as well. This prevents stale form values
  // from being saved if the amount, approval date, or linked PO settings changed.
  const po = window.currentPOForInvoice || {};
  const retentionApplies = po.retention_applicable === true;
  const retentionPct = retentionApplies ? Number(po.retention_percentage || 0) / 100 : 0;
  const retentionAmount = amount * retentionPct;
  const retentionVat = currentInvoiceVat ? retentionAmount * 0.15 : 0;
  let advanceAvailability;try{advanceAvailability=await getAdvanceAvailability(po,currentInvoiceId);}catch(e){alert('Could not calculate remaining advance: '+e.message);return;}
  const advanceAmortisation=calculateAdvanceAmortisation(amount,po,advanceAvailability.available);
  const approvalDate = document.getElementById("inv_approval_date").value || null;
  const retentionDueDate = approvalDate && retentionApplies
    ? calculateDueDate(approvalDate, Number(po.retention_period_days || 0)) : null;

  const updates = {
    invoice_no: document.getElementById("inv_invoice_no").value.trim(),
    status: document.getElementById("inv_status").value,
    start_date: document.getElementById("inv_start_date").value || null,
    completed_date: document.getElementById("inv_completed_date").value || null,
    approval_date: approvalDate,
    payment_terms: terms,
    invoice_amount: amount,
    paid_amount: paid,
    advance_amortisation: advanceAmortisation,
    retention_released_amount: Number(document.getElementById("inv_retention_released_amount")?.value || 0),
    retention_amount: Number(retentionAmount.toFixed(2)),
    retention_vat: Number(retentionVat.toFixed(2)),
    retention_due_date: retentionDueDate,
    erp: document.getElementById("inv_erp").checked,
    description: document.getElementById("inv_description").value
  };

  const { error } = await supabaseClient
    .from("invoices").update(updates).eq("id", currentInvoiceId);
  if(error){
    document.getElementById("invoiceEditMessage").textContent = "Save failed: " + error.message;
    document.getElementById("invoiceEditMessage").style.color = "red";
    return;
  }

  try{await recalculatePOAdvanceAmortisations(po.po_no,po.po_value_ex_vat,Number(po.advance_payment_percentage||0));}
  catch(e){document.getElementById("invoiceEditMessage").textContent = "Invoice saved, but advance schedule recalculation failed: " + e.message;document.getElementById("invoiceEditMessage").style.color = "red";return;}
  document.getElementById("invoiceEditMessage").textContent = "Invoice updated successfully.";
  document.getElementById("invoiceEditMessage").style.color = "green";
  const poNo = currentInvoicePoNo;
  closeInvoiceModal();
  if(returnToPaidInvoices){returnToPaidInvoices=false;await showPaidInvoices();}else{await openInvoices(poNo);}
}

async function recalculatePOAdvanceAmortisations(poNo, poValue, advancePct){
 const {data:invs,error}=await supabaseClient.from('invoices').select('id,invoice_amount,start_date').eq('po_no',poNo).order('start_date',{ascending:true}).order('id',{ascending:true});
 if(error) throw error;
 let remaining=Math.max(0,Number(poValue||0)*Number(advancePct||0)/100);
 for(const inv of (invs||[])){
   const desired=Math.max(0,Number(inv.invoice_amount||0)*Number(advancePct||0)/100);
   const amort=Number(Math.min(desired,remaining).toFixed(2));
   const {error:updateError}=await supabaseClient.from('invoices').update({advance_amortisation:amort}).eq('id',inv.id);
   if(updateError) throw updateError;
   remaining=Math.max(0,remaining-amort);
 }
}

async function getAdvanceAvailability(po, excludeInvoiceId=null){
 const pct=Number(po.advance_payment_percentage||0),total=Number(po.po_value_ex_vat||0)*pct/100;
 let q=supabaseClient.from('invoices').select('id,advance_amortisation').eq('po_no',po.po_no);
 if(excludeInvoiceId!==null) q=q.neq('id',excludeInvoiceId);
 const {data,error}=await q;if(error)throw error;
 const used=(data||[]).reduce((a,x)=>a+Number(x.advance_amortisation||0),0);
 return {percentage:pct,advanceAmount:total,used,available:Math.max(0,total-used)};
}
function calculateAdvanceAmortisation(amount, po, available){
 const requested=Math.max(0,Number(amount||0)*Number(po.advance_payment_percentage||0)/100);
 return Number(Math.min(requested,Math.max(0,Number(available||0))).toFixed(2));
}

async function manageAttachments(type,id){
 currentAttachmentType=type;currentAttachmentId=id;
 document.getElementById('invoiceModalContent').innerHTML=`<h2>${type==='po'?'Purchase Order':'Invoice'} Attachments</h2><div id="attachmentAuth"></div><div id="attachmentWorkspace" style="display:none"><input id="attachmentFiles" type="file" multiple><button class="btn-po" onclick="uploadAttachments()">Upload</button><div id="attachmentList">Loading attachments...</div></div><div class="modal-actions"><button onclick="closeInvoiceModal()">Close</button></div>`;
 document.getElementById('invoiceModal').style.display='block';
 const {data:{session}}=await attachmentClient.auth.getSession();
 if(!session){document.getElementById('attachmentAuth').innerHTML=`<div class="warning-panel">Sign in to upload or view confidential attachments. Create an authorized user first in Supabase Authentication → Users.</div><div class="invoice-fields"><div class="invoice-field"><label>Email</label><input id="attachmentEmail" type="email" autocomplete="username"></div><div class="invoice-field"><label>Password</label><input id="attachmentPassword" type="password" autocomplete="current-password"></div></div><button class="btn-po" onclick="signInAttachmentUser()">Sign In</button><p id="attachmentAuthMessage"></p>`;return;}
 document.getElementById('attachmentWorkspace').style.display='block';await loadAttachments();

async function signInAttachmentUser(){
 const email=document.getElementById('attachmentEmail').value.trim(),password=document.getElementById('attachmentPassword').value;
 const {error}=await attachmentClient.auth.signInWithPassword({email,password});if(error){document.getElementById('attachmentAuthMessage').textContent=error.message;return;}
 document.getElementById('attachmentAuth').innerHTML='<p>Authenticated attachment access enabled.</p><button onclick="signOutAttachmentUser()">Sign Out</button>';
 document.getElementById('attachmentWorkspace').style.display='block';await loadAttachments();
}
async function signOutAttachmentUser(){await attachmentClient.auth.signOut();manageAttachments(currentAttachmentType,currentAttachmentId);}
async function loadAttachments(){
 const {data,error}=await attachmentClient.from('record_attachments').select('*').eq('record_type',currentAttachmentType).eq('record_id',currentAttachmentId).order('created_at',{ascending:false});const el=document.getElementById('attachmentList');if(!el)return;if(error){el.textContent='Attachment list error: '+error.message+' (check SQL migration and authenticated policies)';return;}el.innerHTML=(data||[]).map(f=>`<p>${escapeHtml(f.file_name)} (${Math.round(Number(f.size_bytes||0)/1024)} KB) <button class="small-btn" onclick="downloadAttachment('${escapeHtml(f.storage_path)}')">Download</button></p>`).join('')||'<p>No attachments.</p>';
}
async function uploadAttachments(){
  const {data:{session},error:sessionError}=await attachmentClient.auth.getSession();
  if(sessionError){alert('Could not verify attachment login: '+sessionError.message);return;}
  if(!session){alert('Sign in before uploading attachments.');return;}

  if(!['po','invoice'].includes(currentAttachmentType) || !currentAttachmentId){
    alert('Invalid attachment record. Close this window and open the attachments from a PO or invoice.');
    return;
  }

  const tableName=currentAttachmentType==='po'?'pos':'invoices';
  const {data:record,error:recordError}=await attachmentClient
    .from(tableName)
    .select('project_id')
    .eq('id',currentAttachmentId)
    .single();
  if(recordError || !record || !Number.isSafeInteger(Number(record.project_id)) || Number(record.project_id)<=0){
    alert('Could not determine the project for this attachment: '+(recordError?.message||'Invalid project ID'));
    return;
  }
  const projectId=Number(record.project_id);
  const files=[...(document.getElementById('attachmentFiles')?.files||[])];
  if(!files.length){alert('Select at least one file.');return;}

  for(const f of files){
    const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,180)||'attachment';
    const unique=`${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    // Storage RLS requires the first path segment to be the numeric project_id.
    const path=`${projectId}/${currentAttachmentType}_${currentAttachmentId}_${unique}_${safe}`;
    const up=await attachmentClient.storage.from(ATTACHMENT_BUCKET).upload(path,f,{upsert:false});
    if(up.error){alert('Upload failed: '+up.error.message);return;}

    const ins=await attachmentClient.from('record_attachments').insert([{
      record_type:currentAttachmentType,
      record_id:currentAttachmentId,
      file_name:f.name,
      storage_path:path,
      mime_type:f.type,
      size_bytes:f.size
    }]);
    if(ins.error){
      // Remove the uploaded object if its database metadata could not be saved.
      await attachmentClient.storage.from(ATTACHMENT_BUCKET).remove([path]);
      alert('Attachment details could not be saved: '+ins.error.message+' The uploaded file was removed.');
      return;
    }
  }
  await loadAttachments();
  alert('Attachments uploaded.');
}
async function downloadAttachment(path){const {data,error}=await attachmentClient.storage.from(ATTACHMENT_BUCKET).createSignedUrl(path,300);if(error){alert(error.message);return;}window.open(data.signedUrl,'_blank','noopener');}

async function refreshDashboard(){const b=document.getElementById('refreshButton');if(b){b.disabled=true;b.textContent='Refreshing...';}try{await loadProjects();if(currentProjectId!==null){await openProject(currentProjectId);if(currentInvoicePoNo)await openInvoices(currentInvoicePoNo);}}catch(e){alert('Refresh failed: '+e.message);}finally{if(b){b.disabled=false;b.textContent='Refresh';}}}

loadProjects();

</script>
