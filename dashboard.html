<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projects Dashboard V11</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1,h2,h3{
    margin-top:0;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
    margin-right:5px;
}

button:hover{
    background:#1d4ed8;
}

button.invoice{
    background:#16a34a;
}

button.invoice:hover{
    background:#15803d;
}

input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1e293b;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ddd;
    padding:10px;
}

.current-project{
    background:#dbeafe;
    padding:15px;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Projects Dashboard V11</h1>

<button onclick="addPO()">
Add PO
</button>

<button onclick="loadProjects()">
Refresh
</button>

<input
type="text"
id="searchBox"
placeholder="Search Project"
onkeyup="filterProjects()">

</div>

<div class="card">

<h2>Projects List</h2>

<div id="projectsList">
Loading...
</div>

</div>

<div class="card">

<h2>Current Project</h2>

<div id="projectDetails">

No project selected

</div>

</div>

</div>

<script>

const SUPABASE_URL =
'https://hxhfjmtjibwkkbpakopt.supabase.co';

const SUPABASE_KEY =
'sb_publishable_xdtW1wLuLjRUTs5z4MZEQA_H8hTEFi9';

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentProjectId = null;
let currentProjectName = null;

async function loadProjects(){

const { data, error } =
await supabaseClient
.from('projects')
.select('*')
.order('id');

if(error){

document.getElementById('projectsList').innerHTML =
error.message;

return;

}

let html = '<table>';

html += `
<tr>
<th>ID</th>
<th>Project Name</th>
<th>Company</th>
<th>Status</th>
<th>Open</th>
</tr>
`;

data.forEach(project => {

html += `
<tr>

<td>${project.id}</td>

<td>${project.project_name || ''}</td>

<td>${project.company || ''}</td>

<td>${project.status || ''}</td>

<td>
<button onclick="openProject(${project.id})">
Open
</button>
</td>

</tr>
`;

});

html += '</table>';

document.getElementById('projectsList').innerHTML =
html;

}

async function openProject(projectId){

const { data, error } =
await supabaseClient
.from('projects')
.select('*')
.eq('id', projectId)
.single();

if(error){

alert(error.message);
return;

}

currentProjectId = projectId;
currentProjectName = data.project_name;

document.getElementById('projectDetails')
.innerHTML = `

<div class="current-project">

<h3>${data.project_name}</h3>

<p><b>Company:</b>
${data.company || ''}</p>

<p><b>Department:</b>
${data.department || ''}</p>

<p><b>Project Manager:</b>
${data.project_manager || ''}</p>

<p><b>Status:</b>
${data.status || ''}</p>

</div>

<br>

<div style="margin-top:15px;">

<button onclick="addPO()">
Add PO
</button>

</div>

<br>

<h3>Purchase Orders</h3>

<div id="poList">
Loading PO List...
</div>

`;

loadPOs(data.id);

}

async function loadPOs(projectId){

const { data, error } =
await supabaseClient
.from('pos')
.select('*')
.eq('project_id', projectId);
if(error){

document.getElementById('poList').innerHTML =
error.message;

return;

}

if(!data || data.length === 0){

document.getElementById('poList').innerHTML =
'No Purchase Orders Found';

return;

}

let html = `
<table>

<tr>
<th>PO Number</th>
<th>Company</th>
<th>PO Value</th>
<th>PO Date</th>
<th>Invoice</th>
</tr>
`;

data.forEach(po => {

html += `

<tr>

<td>${po.po_no || ''}</td>

<td>${po.company || ''}</td>

<td>${po.po_value_ex_vat || 0}</td>

<td>${po.po_date || ''}</td>

<td>

<button
class="invoice"
onclick="addInvoice(
'${po.po_no}',
${currentProjectId}
)">
Add Invoice
</button>

</td>

</tr>

`;

});

html += '</table>';

document.getElementById('poList').innerHTML =
html;

}

function addPO(){

if(!currentProjectId){

alert(
'Please open a project first'
);

return;

}

window.location.href =
'index.html';

}

function addInvoice(poNo, projectId){

alert(
'Invoice Module\n\n' +
'PO Number: ' + poNo +
'\nProject ID: ' + projectId
);

}

function filterProjects(){

const search =
document.getElementById('searchBox')
.value
.toLowerCase();

const rows =
document.querySelectorAll('table tr');

rows.forEach((row,index)=>{

if(index===0) return;

row.style.display =
row.innerText.toLowerCase()
.includes(search)
? ''
: 'none';

});

}

loadProjects();

</script>

</body>
</html>
