<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projects Dashboard V12</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
    margin-right:5px;
}

button:hover{
    background:#1d4ed8;
}

.btn-po{
    background:#16a34a;
}

.btn-po:hover{
    background:#15803d;
}

input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1e293b;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ddd;
    padding:10px;
}

.current-project{
    background:#dbeafe;
    padding:15px;
    border-radius:10px;
}


#invoiceModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;overflow:auto;padding:25px;box-sizing:border-box;}
#invoiceModalContent{background:#fff;max-width:950px;margin:25px auto;padding:25px;border-radius:10px;box-shadow:0 5px 25px rgba(0,0,0,.25);}
.invoice-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;}
.invoice-field label{display:block;font-weight:bold;margin-bottom:6px;}
.invoice-field input,.invoice-field select,.invoice-field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:5px;}
.invoice-field input[type=checkbox]{width:auto;}
.modal-actions{display:flex;gap:8px;margin-top:20px;}
@media(max-width:650px){.invoice-fields{grid-template-columns:1fr;}#invoiceModal{padding:8px;}#invoiceModalContent{padding:15px;}}

</head>

        <th>Status</th>

    return;
}

"projectDetails"
).innerHTML = `

<div class="current-project">

<p>
<b>Company:</b>
${data.company || ""}
</p>

<p>
<b>Department:</b>
${data.department || ""}
</p>

<p>
<b>Project Manager:</b>
${data.project_manager || ""}
</p>

<p>
<b>Status:</b>
${data.status || ""}

<h3>Purchase Orders</h3>

async function loadPOs(projectId){

const { data, error } =
await supabaseClient
.from("pos")
.select("*")
.eq("project_id", projectId)
.order("id");

if(error){

document.getElementById(
"poList"
).innerHTML =
error.message;

return;

}

if(!data || data.length===0){

document.getElementById(
"poList"
).innerHTML =
"No Purchase Orders";

return;

}

// Sum invoice amounts before VAT for each purchase order.
const poNumbers = data.map(po => po.po_no).filter(Boolean);
const { data: invoiceRows, error: invoiceError } = await supabaseClient
  .from("invoice_details")
  .select("po_no, invoice_amount")
  .in("po_no", poNumbers);

if(invoiceError){
  document.getElementById("poList").innerHTML = invoiceError.message;
  return;
}

const invoicedByPO = {};
(invoiceRows || []).forEach(inv => {
  const key = inv.po_no;
  invoicedByPO[key] = (invoicedByPO[key] || 0) + Number(inv.invoice_amount || 0);
});

let html = `
<table>
<tr>
<th>PO Number</th>
<th>Company</th>
<th>PO Value (Excl. VAT)</th>
<th>Invoices Issued (Excl. VAT)</th>
<th>PO Balance (Excl. VAT)</th>
<th>Date</th>
<th>Invoices</th>
<th>Add Invoice</th>
</tr>
`;

data.forEach(po=>{
  const poValue = Number(po.po_value_ex_vat || 0);
  const invoicedAmount = Number(invoicedByPO[po.po_no] || 0);
  const poBalance = poValue - invoicedAmount;

html += `
<tr>
<td>${escapeHtml(po.po_no || "")}</td>
<td>${escapeHtml(po.company || "")}</td>
<td>${poValue.toFixed(2)}</td>
<td>${invoicedAmount.toFixed(2)}</td>
<td>${poBalance.toFixed(2)}</td>
<td>${escapeHtml(po.po_date || "")}</td>

<td>
<button
onclick="openInvoices('${po.po_no}')">
Open
</button>
</td>

<td>
<button
class="btn-po"
onclick="addInvoice('${po.po_no}',${projectId})">
Add Invoice
</button>
</td>

</tr>
`;

});

html += "</table>";

document.getElementById(
"poList"
).innerHTML = html;

}

function filterProjects(){

const search =
document.getElementById(
"searchBox"
).value.toLowerCase();

const rows =
document.querySelectorAll(
"#projectsList table tr"
);

rows.forEach((row,index)=>{

if(index===0) return;

row.style.display =
row.innerText
.toLowerCase()
.includes(search)
? ""
: "none";

});

}

function addProject(){

document.getElementById(
"projectModal"
).style.display =
"block";

}

function closeProjectModal(){

document.getElementById(
"projectModal"
).style.display =
"none";

}

"new_company"
).value,

department:

let currentProjectId = null;
let currentInvoicePoNo = null;
let currentInvoiceVat = false;

async function addInvoice(poNo, projectId){
  const [{data: project, error: projectError}, {data: po, error: poError}] = await Promise.all([
    supabaseClient.from("projects").select("id, project_name").eq("id", projectId).single(),
    supabaseClient.from("pos").select("po_no, vat, project_id").eq("po_no", poNo).single()
  ]);
  if(projectError){ alert("Could not load project: " + projectError.message); return; }
  if(poError){ alert("Could not load Purchase Order: " + poError.message); return; }

  currentInvoiceId = null;
  currentInvoicePoNo = poNo;
  currentProjectId = projectId;
  currentInvoiceVat = po.vat === true;
  const formHtml = `
    <h2>Add Invoice</h2>
    <div class="invoice-fields">
      <div class="invoice-field"><label>Project Name</label><input value="${escapeHtml(project.project_name || "")}" readonly></div>
      <div class="invoice-field"><label>PO Number</label><input value="${escapeHtml(poNo)}" readonly></div>
      <div class="invoice-field"><label>Invoice Number *</label><input id="new_inv_invoice_no" type="text" required></div>
      <div class="invoice-field"><label>Status</label><select id="new_inv_status"><option>Draft</option><option>Submitted</option><option>Approved</option><option>Partially Paid</option><option>Paid</option><option>Cancelled</option></select></div>
      <div class="invoice-field"><label>Invoice Amount (Excl. VAT) *</label><input id="new_inv_amount" type="number" min="0" step="0.01" value="0" oninput="updateNewInvoiceTotals()"></div>
      <div class="invoice-field"><label>Paid Amount (Incl. VAT)</label><input id="new_inv_paid" type="number" min="0" step="0.01" value="0" oninput="updateNewInvoiceTotals()"></div>
      <div class="invoice-field"><label>VAT Applicable</label><input value="${currentInvoiceVat ? "Yes - 15%" : "No"}" readonly></div>
      <div class="invoice-field"><label>VAT Amount</label><input id="new_inv_vat" value="0.00" readonly></div>
      <div class="invoice-field"><label>Invoice Total (Incl. VAT)</label><input id="new_inv_total" value="0.00" readonly></div>
      <div class="invoice-field"><label>Remaining Balance</label><input id="new_inv_balance" value="0.00" readonly></div>
      <div class="invoice-field"><label>Invoice Date</label><input id="new_inv_start_date" type="date"></div>
      <div class="invoice-field"><label>Approval Date</label><input id="new_inv_approval_date" type="date" oninput="updateNewInvoiceTotals()"></div>
      <div class="invoice-field"><label>Payment Terms (Days)</label><input id="new_inv_terms" type="number" min="0" value="60" oninput="updateNewInvoiceTotals()"></div>
      <div class="invoice-field"><label>Due Date</label><input id="new_inv_due_date" value="" readonly></div>
      <div class="invoice-field"><label>Overdue Status</label><input id="new_inv_overdue_status" value="Not Due" readonly></div>
      <div class="invoice-field"><label>Completed Date</label><input id="new_inv_completed_date" type="date"></div>
      <div class="invoice-field"><label>Description</label><textarea id="new_inv_description" rows="2"></textarea></div>
    </div>
    <p id="newInvoiceMessage"></p>
    <div class="modal-actions">
      <button class="btn-po" onclick="saveNewInvoice()">Save Invoice</button>
      <button onclick="closeInvoiceModal()" style="background:#64748b">Cancel</button>
    </div>`;
  document.getElementById("invoiceModalContent").innerHTML = formHtml;
  document.getElementById("invoiceModal").style.display = "block";
  updateNewInvoiceTotals();
}

function updateNewInvoiceTotals(){
  const amount = Number(document.getElementById("new_inv_amount")?.value || 0);
  const paid = Number(document.getElementById("new_inv_paid")?.value || 0);
  const vat = currentInvoiceVat ? amount * 0.15 : 0;
  const total = amount + vat;
  document.getElementById("new_inv_vat").value = vat.toFixed(2);
  document.getElementById("new_inv_total").value = total.toFixed(2);
  const balance = total - paid;
  document.getElementById("new_inv_balance").value = balance.toFixed(2);
  const dueDate = calculateDueDate(
    document.getElementById("new_inv_approval_date").value,
    document.getElementById("new_inv_terms").value
  );
  document.getElementById("new_inv_due_date").value = dueDate;
  document.getElementById("new_inv_overdue_status").value = getOverdueStatus(dueDate, balance);
}

function calculateDueDate(approvalDate, paymentTerms){
  if(!approvalDate || paymentTerms === "" || paymentTerms === null || paymentTerms === undefined) return "";
  const date = new Date(approvalDate + "T12:00:00");
  if(Number.isNaN(date.getTime())) return "";
  date.setDate(date.getDate() + Number(paymentTerms || 0));
  const year = date.getFullYear();
  const month = String(date.getMonth()+1).padStart(2,"0");
  const day = String(date.getDate()).padStart(2,"0");
  return `${year}-${month}-${day}`;
}

async function saveNewInvoice(){
  const invoiceNo = document.getElementById("new_inv_invoice_no").value.trim();
  const amount = Number(document.getElementById("new_inv_amount").value || 0);
  const paid = Number(document.getElementById("new_inv_paid").value || 0);
  const terms = Number(document.getElementById("new_inv_terms").value || 0);
  if(!invoiceNo){ alert("Invoice Number is required."); return; }
  if(amount <= 0 || paid < 0 || terms < 0){ alert("Enter a valid invoice amount, paid amount and payment terms."); return; }

  const { data: project, error: projectError } = await supabaseClient
    .from("projects").select("project_name").eq("id", currentProjectId).single();
  if(projectError){ alert("Could not confirm project: " + projectError.message); return; }

  const payload = {
    invoice_no: invoiceNo,
    status: document.getElementById("new_inv_status").value,
    po_no: currentInvoicePoNo,
    project_id: currentProjectId,
    project_name: project.project_name,
    invoice_amount: amount,
    paid_amount: paid,
    start_date: document.getElementById("new_inv_start_date").value || null,
    approval_date: document.getElementById("new_inv_approval_date").value || null,
    completed_date: document.getElementById("new_inv_completed_date").value || null,
    payment_terms: terms,
    description: document.getElementById("new_inv_description").value.trim(),
    erp: false
  };
  const { error } = await supabaseClient.from("invoices").insert([payload]);
  if(error){
    const msg = document.getElementById("newInvoiceMessage");
    msg.textContent = "Save failed: " + error.message;
    msg.style.color = "red";
    return;
  }
  closeInvoiceModal();
  await openInvoices(currentInvoicePoNo);
}

async function openInvoices(poNo){

const { data, error } = await supabaseClient
  .from("invoice_details")
  .select("*")
  .eq("po_no", poNo);

if(error){ alert(error.message); return; }
if(!data || data.length===0){ alert("No Invoices Found For " + poNo); return; }

let html = `
<h3>Invoices For ${escapeHtml(poNo)}</h3>
<table>
<tr>
<th>Open</th><th>Invoice No</th><th>Invoice Date</th>
<th>Approval Date</th><th>Payment Terms</th><th>Due Date</th>
<th>Amount Excl. VAT</th><th>VAT</th><th>Invoice Total</th><th>Paid</th><th>Balance</th><th>Payment Status</th><th>Overdue Status</th><th>Invoice Status</th>
</tr>`;

data.forEach(inv=>{
  html += `
  <tr>
    <td><button onclick="showInvoiceDetails(${Number(inv.id)})">Open</button></td>
    <td>${escapeHtml(inv.invoice_no || "")}</td>
    <td>${escapeHtml(inv.start_date || "")}</td>
    <td>${escapeHtml(inv.approval_date || "")}</td>
    <td>${escapeHtml(inv.payment_terms ?? "")}</td>
    <td>${escapeHtml(inv.due_date || "")}</td>
    <td>${Number(inv.invoice_amount || 0).toFixed(2)}</td>
    <td>${Number(inv.vat_amount || 0).toFixed(2)}</td>
    <td>${Number(inv.invoice_total || 0).toFixed(2)}</td>
    <td>${Number(inv.paid_amount || 0).toFixed(2)}</td>
    <td>${Number(inv.open_balance || 0).toFixed(2)}</td>
    <td>${escapeHtml(inv.payment_status || "")}</td>
    <td>${escapeHtml(getOverdueStatus(inv.due_date, Number(inv.open_balance || 0)))}</td>
    <td>${escapeHtml(inv.status || "")}</td>
  </tr>`;
});

html += "</table>";
document.getElementById("poList").innerHTML = html;
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

let currentInvoiceId = null;

function toDateInput(value){
  return value ? String(value).slice(0,10) : "";
}

async function showInvoiceDetails(invoiceId){
  const { data, error } = await supabaseClient
    .from("invoice_details").select("*").eq("id", invoiceId).single();
  if(error){ alert("Could not load invoice: " + error.message); return; }

  currentInvoiceId = invoiceId;
  currentInvoicePoNo = data.po_no;
  currentInvoiceVat = data.vat_applicable === true;
  const fields = [
    ["invoice_no", "Invoice Number", data.invoice_no || "", "text"],
    ["status", "Status", data.status || "Draft", "select"],
    ["po_no", "PO Number", data.po_no || "", "readonly"],
    ["project_id", "Project ID", data.project_id ?? "", "readonly"],
    ["project_name", "Project Name", data.project_name || "", "readonly"],
    ["start_date", "Invoice Date", toDateInput(data.start_date), "date"],
    ["approval_date", "Approval Date", toDateInput(data.approval_date), "date"],
    ["payment_terms", "Payment Terms (Days)", data.payment_terms ?? "", "number"],
    ["due_date", "Due Date", toDateInput(data.due_date), "calculated"],
    ["completed_date", "Completed Date", toDateInput(data.completed_date), "date"],
    ["invoice_amount", "Invoice Amount (Excl. VAT)", data.invoice_amount ?? 0, "number"],
    ["paid_amount", "Paid Amount (Incl. VAT)", data.paid_amount ?? 0, "number"],
    ["vat_amount", "VAT Amount", Number(data.vat_amount || 0).toFixed(2), "calculated"],
    ["invoice_total", "Invoice Total", Number(data.invoice_total || 0).toFixed(2), "calculated"],
    ["open_balance", "Remaining Balance", Number(data.open_balance || 0).toFixed(2), "calculated"],
    ["payment_status", "Payment Status", data.payment_status || "", "calculated"],
    ["overdue_status", "Overdue Status", getOverdueStatus(data.due_date, Number(data.open_balance || 0)), "calculated"],
    ["erp", "ERP", data.erp ? "true" : "false", "checkbox"],
    ["description", "Description", data.description || "", "textarea"]
  ];

  let formHtml = `<h2>Invoice Details</h2><div class="invoice-fields">`;
  for(const [key,label,value,type] of fields){
    formHtml += `<div class="invoice-field"><label for="inv_${key}">${label}</label>`;
    if(type === "select"){
      const statuses = ["Draft","Submitted","Approved","Partially Paid","Paid","Cancelled",value].filter((v,i,a)=>v && a.indexOf(v)===i);
      formHtml += `<select id="inv_${key}" disabled>${statuses.map(st => `<option ${st===value?'selected':''}>${escapeHtml(st)}</option>`).join("")}</select>`;
    } else if(type === "textarea"){
      formHtml += `<textarea id="inv_${key}" rows="3" disabled>${escapeHtml(value)}</textarea>`;
    } else if(type === "checkbox"){
      formHtml += `<input id="inv_${key}" type="checkbox" ${value==="true"?"checked":""} disabled>`;
    } else {
      formHtml += `<input id="inv_${key}" type="${type==='readonly'||type==='calculated'?'text':type}" value="${escapeHtml(value)}" ${type==='readonly'||type==='calculated'?'readonly':''} disabled>`;
    }
    formHtml += `</div>`;
  }
  formHtml += `</div>
    <p id="invoiceEditMessage"></p>
    <div class="modal-actions">
      <button id="invoiceEditButton" onclick="enableInvoiceEdit()">Edit</button>
      <button id="invoiceSaveButton" class="btn-po" style="display:none" onclick="saveInvoiceChanges()">Save Changes</button>
      <button onclick="closeInvoiceModal()" style="background:#64748b">Close</button>
    </div>`;

  document.getElementById("invoiceModalContent").innerHTML = formHtml;
  document.getElementById("invoiceModal").style.display = "block";
  updateExistingInvoiceTotals();
  ["inv_approval_date", "inv_payment_terms", "inv_invoice_amount", "inv_paid_amount"].forEach(id => {
    document.getElementById(id)?.addEventListener("input", updateExistingInvoiceTotals);
    document.getElementById(id)?.addEventListener("change", updateExistingInvoiceTotals);
  });
}

function updateExistingInvoiceTotals(){
  const amount = Number(document.getElementById("inv_invoice_amount")?.value || 0);
  const paid = Number(document.getElementById("inv_paid_amount")?.value || 0);
  const vat = currentInvoiceVat ? amount * 0.15 : 0;
  const total = amount + vat;
  const balance = total - paid;
  const vatEl = document.getElementById("inv_vat_amount");
  const totalEl = document.getElementById("inv_invoice_total");
  const balanceEl = document.getElementById("inv_open_balance");
  const statusEl = document.getElementById("inv_payment_status");
  const dueEl = document.getElementById("inv_due_date");
  const overdueEl = document.getElementById("inv_overdue_status");
  if(vatEl) vatEl.value = vat.toFixed(2);
  if(totalEl) totalEl.value = total.toFixed(2);
  if(balanceEl) balanceEl.value = balance.toFixed(2);
  if(statusEl) statusEl.value = paid <= 0 ? "Unpaid" : balance <= 0 ? "Paid" : "Partially Paid";
  if(dueEl) dueEl.value = calculateDueDate(document.getElementById("inv_approval_date")?.value, document.getElementById("inv_payment_terms")?.value);
  if(overdueEl) overdueEl.value = getOverdueStatus(dueEl?.value, balance);
}

function getOverdueStatus(dueDate, balance){
  if(Number(balance) <= 0.005) return "Paid";
  if(!dueDate) return "Due Date Not Set";
  const today = new Date();
  const todayText = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  return String(dueDate).slice(0,10) < todayText ? "Overdue" : "Not Overdue";
}

function enableInvoiceEdit(){
  document.querySelectorAll("#invoiceModalContent input:not([readonly]), #invoiceModalContent select, #invoiceModalContent textarea")
    .forEach(el => el.disabled = false);
  document.getElementById("invoiceEditButton").style.display = "none";
  document.getElementById("invoiceSaveButton").style.display = "inline-block";
}

function closeInvoiceModal(){
  document.getElementById("invoiceModal").style.display = "none";
  currentInvoiceId = null;
}

async function saveInvoiceChanges(){
  if(!currentInvoiceId) return;
  const amount = Number(document.getElementById("inv_invoice_amount").value || 0);
  const paid = Number(document.getElementById("inv_paid_amount").value || 0);
  const terms = Number(document.getElementById("inv_payment_terms").value || 0);
  if(amount < 0 || paid < 0 || terms < 0){
    alert("Amounts and payment terms cannot be negative."); return;
  }

  const updates = {
    invoice_no: document.getElementById("inv_invoice_no").value.trim(),
    status: document.getElementById("inv_status").value,
    start_date: document.getElementById("inv_start_date").value || null,
    completed_date: document.getElementById("inv_completed_date").value || null,
    approval_date: document.getElementById("inv_approval_date").value || null,
    payment_terms: terms,
    invoice_amount: amount,
    paid_amount: paid,
    erp: document.getElementById("inv_erp").checked,
    description: document.getElementById("inv_description").value
  };

  const { error } = await supabaseClient
    .from("invoices").update(updates).eq("id", currentInvoiceId);
  if(error){
    document.getElementById("invoiceEditMessage").textContent = "Save failed: " + error.message;
    document.getElementById("invoiceEditMessage").style.color = "red";
    return;
  }

  document.getElementById("invoiceEditMessage").textContent = "Invoice updated successfully.";
  document.getElementById("invoiceEditMessage").style.color = "green";
  const poNo = currentInvoicePoNo;
  closeInvoiceModal();
  await openInvoices(poNo);
}
